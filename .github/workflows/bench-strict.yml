name: Bench Strict
# W1-10 (#1507), owner decision: perf budgets (TECH-SPEC §7) are enforced on
# push to main and nightly, never on PRs (report-only there). Strict mode
# fails over-budget benches; ROX_BENCH_RUNS=3 takes the median of 3 run
# medians to absorb shared-runner noise. Benches without product code yet
# are labelled `synthetic` in the gate summary (packages/test-harness/src/bench.ts).
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bench-strict-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bench-strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: '1.4.2' }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Strict micro-benchmarks (median of 3 runs)
        run: bun run scripts/run-unified-gates.ts --only perf-microbench
        env:
          ROX_BENCH_STRICT: '1'
          ROX_BENCH_RUNS: '3'
