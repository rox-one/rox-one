name: Bench Strict
# W1-10 (#1507), owner decision: perf budgets (TECH-SPEC §7) are enforced on
# push to main and nightly, never on PRs (report-only there). Strict mode
# fails over-budget benches; ROX_BENCH_RUNS=3 takes the median of 3 run
# medians to absorb shared-runner noise. Benches without product code yet
# are labelled `synthetic` in the gate summary (packages/test-harness/src/bench.ts).
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bench-strict-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bench-strict:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.14' }
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Strict micro-benchmarks (median of 3 runs)
        run: bun run scripts/run-unified-gates.ts --only perf-microbench
        env:
          ROX_BENCH_STRICT: '1'
          ROX_BENCH_RUNS: '3'
