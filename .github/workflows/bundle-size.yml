name: Bundle Size
# Renderer bundle-size budget gate (perf-baselines/bundle-size.json) over the emitted
# apps/electron/dist/renderer/assets chunks (js and css; never source maps or the pdf worker), so it
# needs a real renderer build first. What `bun scripts/check-bundle-size.ts --check` gates:
#   * a budget is the TOTAL raw bytes of every measured chunk sharing one chunk-name prefix, NOT the
#     largest chunk, so a budgeted prefix (`budgets` for js, `stylesheets` for css) may not grow past
#     its recorded total and an unbudgeted prefix may not pass MAX_NEW_CHUNK_BYTES (2,500,000 B);
#   * each whole-extension total may not grow past its recorded `totals` entry;
#   * the `startup` section gates an entry page's deduped static JS closure: it may not grow past its
#     recorded total, or MAX_NEW_STARTUP_BYTES (8,000,000 B) for an html file with no recorded entry.
# Blocking: no continue-on-error.
on:
  push:
    branches: [main]
    paths:
      - 'apps/electron/**'
      - 'packages/**'
      - 'scripts/check-bundle-size.ts'
      - 'scripts/perf-gate-regen.ts'
      - 'scripts/boot-manifest.ts'
      - 'scripts/__tests__/boot-manifest.test.ts'
      - 'scripts/__tests__/check-bundle-size.test.ts'
      - 'apps/electron/src/shared/rail-surfaces.ts'
      - 'scripts/electron-build-renderer.ts'
      - 'apps/electron/vite.config.ts'
      - 'perf-baselines/bundle-size.json'
      - 'bun.lock'
      - 'package.json'
      - 'bunfig.toml'
      - 'tsconfig.json'
      - '.github/workflows/bundle-size.yml'
  pull_request:
    paths:
      - 'apps/electron/**'
      - 'packages/**'
      - 'scripts/check-bundle-size.ts'
      - 'scripts/perf-gate-regen.ts'
      - 'scripts/boot-manifest.ts'
      - 'scripts/__tests__/boot-manifest.test.ts'
      - 'scripts/__tests__/check-bundle-size.test.ts'
      - 'apps/electron/src/shared/rail-surfaces.ts'
      - 'scripts/electron-build-renderer.ts'
      - 'apps/electron/vite.config.ts'
      - 'perf-baselines/bundle-size.json'
      - 'bun.lock'
      - 'package.json'
      - 'bunfig.toml'
      - 'tsconfig.json'
      - '.github/workflows/bundle-size.yml'
permissions:
  contents: read
concurrency:
  # Main pushes get their own group per commit, so a superseded push runs to completion in parallel
  # instead of queueing behind the run it replaces; PRs keep one stable group per ref
  # (refs/pull/<n>/merge), so a newer push to the same PR cancels the older run. Cancel-in-progress is
  # therefore a no-op on main (every sha has a unique group) and the PR behaviour it was written for is
  # unchanged.
  group: bundle-size-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: true
jobs:
  bundle-size:
    name: Renderer bundle-size budget
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: '1.4.2' }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      # The renderer build needs no install scripts; skipping them keeps this job hermetic.
      - run: bun install --frozen-lockfile --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build the renderer
        run: bun run electron:build:renderer
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          # The boot-manifest step below derives the closure from the sibling
          # *.js.map files, which the shipped build no longer emits (S9-11).
          # Only this job measures; the packaged app keeps sourcemap: false.
          ROX_RENDERER_SOURCEMAP: '1'
      - name: Bundle-size budget gate
        run: bun scripts/check-bundle-size.ts --check
      # The three checks below are independent of the budget gate: run them even when it fails so a
      # red gate never masks a boot-manifest or unit-test regression (issue #1926, run #797).
      - name: Boot-manifest reproducibility gate
        if: always()
        run: bun run scripts/boot-manifest.ts --check --no-build
      - name: Bundle-size unit tests
        if: always()
        run: bun test scripts/__tests__/check-bundle-size.test.ts
      - name: Boot-manifest + stale-chunk unit tests
        if: always()
        run: bun test scripts/__tests__/boot-manifest.test.ts apps/electron/src/renderer/lib/__tests__/stale-chunk-reload.test.ts