name: Bundle Size
# Renderer bundle-size budget gate (perf-baselines/bundle-size.json): the raw bytes of the largest
# emitted chunk of each name prefix may not grow past its recorded budget, and an unbudgeted chunk
# may not exceed 2.5 MB. The gate measures apps/electron/dist/renderer/assets/*.js only (never
# source maps or the pdf worker), so it needs a real renderer build first. Blocking: no
# continue-on-error.
on:
  push:
    branches: [main]
    paths:
      - 'apps/electron/**'
      - 'packages/**'
      - 'scripts/check-bundle-size.ts'
      - 'scripts/electron-build-renderer.ts'
      - 'apps/electron/vite.config.ts'
      - 'perf-baselines/bundle-size.json'
      - 'bun.lock'
      - '.github/workflows/bundle-size.yml'
  pull_request:
    paths:
      - 'apps/electron/**'
      - 'packages/**'
      - 'scripts/check-bundle-size.ts'
      - 'scripts/electron-build-renderer.ts'
      - 'apps/electron/vite.config.ts'
      - 'perf-baselines/bundle-size.json'
      - 'bun.lock'
      - '.github/workflows/bundle-size.yml'
permissions:
  contents: read
concurrency:
  group: bundle-size-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  bundle-size:
    name: Renderer bundle-size budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: '1.3.14' }
      # The renderer build needs no install scripts; skipping them keeps this job hermetic.
      - run: bun install --frozen-lockfile --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build the renderer
        run: bun run electron:build:renderer
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Bundle-size budget gate
        run: bun scripts/check-bundle-size.ts --check
      - name: Bundle-size unit tests
        run: bun test scripts/__tests__/check-bundle-size.test.ts