name: CI Validate Alias
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.14' }
      - uses: astral-sh/setup-uv@v5
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun test packages/core
      - run: bun run validate:ci
        env:
          # The hosted Electron TypeScript graph exceeded Node's default ~2 GiB heap.
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Verify bundled MCP provisioning and first-session onboarding
        # Uses local protocol fixtures and injected installers, without cloud keys or upstream downloads.
        # The script isolates RPC module mocks from the real transport and transcript suites.
        run: bun run test:mcp-onboarding
