name: CI Validate Alias
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'plans/**'
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24' }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: '1.4.2' }
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun test packages/core
      - name: Guard against duplicate YAML mapping keys
        # GitHub Actions rejects a workflow file with a duplicated key; js-yaml load() catches it.
        run: bun run check-yaml-duplicates
      - name: Verify memory feature unit suites
        # R8-2: the server-core/shared/session-tools memory suites and the repo
        # RPC handler run in no other workflow, so a memory regression could
        # otherwise merge with every gate green.
        run: bun test packages/server-core/src/memory packages/shared/src/memory packages/session-tools-core/src/handlers/memory-repo.test.ts
      - name: Verify reference-engine suites
        # packages/server-core/src/work runs in no other workflow. Before this
        # step the four reference suites had drifted 26 tests red - the W1-11
        # takeover of im.create_chat / workspaces.create left them unable to
        # create a chat - and every gate stayed green, so nothing noticed.
        run: bun test packages/server-core/src/work
      - name: Verify scheduler suites
        # packages/server-core/src/scheduler runs in no other workflow. Its
        # /hooks ingress case (a path outside the prefix must never have its
        # body read) was red on main until 7d16f3126 restored the bound, and
        # nothing else runs this directory - this step keeps that regression
        # from going invisible again.
        run: bun test packages/server-core/src/scheduler
      - name: Verify uncovered server-core suites
        # These packages/server-core/src directories run in no other workflow,
        # so a regression in any of them could merge with every gate green.
        run: bun test packages/server-core/src/agents packages/server-core/src/authority packages/server-core/src/automations packages/server-core/src/board packages/server-core/src/bootstrap packages/server-core/src/collab packages/server-core/src/collaboration packages/server-core/src/command-gateway packages/server-core/src/commands packages/server-core/src/contacts packages/server-core/src/domain packages/server-core/src/drive packages/server-core/src/entities packages/server-core/src/execution packages/server-core/src/feed packages/server-core/src/knowledge packages/server-core/src/meetings packages/server-core/src/nodes packages/server-core/src/openclaw packages/server-core/src/pages packages/server-core/src/runtime packages/server-core/src/security packages/server-core/src/service packages/server-core/src/services packages/server-core/src/state packages/server-core/src/tasks packages/server-core/src/utils packages/server-core/src/workboard packages/server-core/src/workflows packages/server-core/src/workgraph packages/server-core/src/workspace-sync packages/server-core/src/workspace-work packages/server-core/src/xsc
      - name: Verify uncovered renderer suites
        # These apps/electron/src/renderer directories run in no other
        # workflow, so a renderer regression there could merge green.
        run: bun test apps/electron/src/renderer/actions apps/electron/src/renderer/atoms apps/electron/src/renderer/config apps/electron/src/renderer/event-processor apps/electron/src/renderer/mindmap apps/electron/src/renderer/playground apps/electron/src/renderer/shims apps/electron/src/renderer/utils apps/electron/src/renderer/voice
      - name: Verify ui component suites
        # packages/ui/src runs in no other workflow. markdown runs in its own
        # invocation: its DOM setup leaks into primitives/dom-env-restore when
        # both run in the same process.
        run: |
          bun test packages/ui/src/components/markdown/__tests__
          bun test packages/ui/src/__tests__ packages/ui/src/components/annotations/__tests__ packages/ui/src/components/chat/__tests__ packages/ui/src/components/code-viewer/__tests__ packages/ui/src/components/comments/__tests__ packages/ui/src/components/markdown/extensions/__tests__ packages/ui/src/components/overlay/__tests__ packages/ui/src/components/primitives/__tests__ packages/ui/src/components/terminal/__tests__ packages/ui/src/components/ui/__tests__ packages/ui/src/context/__tests__ packages/ui/src/lib/__tests__ packages/ui/src/styles/__tests__
      - name: Verify shared domain-schema suite
        # packages/shared/src/domain runs in no other workflow. validate:ci's
        # test:shared:all covers other shared suites only, so a broken domain
        # entity schema (contacts, tasks, calendar, ...) could merge green.
        run: bun test packages/shared/src/domain
      - name: Verify renderer warmup suite
        # apps/electron/src/renderer/lib/__tests__/warmup.test.ts runs in no
        # other workflow, so a renderer warmup regression could otherwise
        # merge with every gate green.
        run: bun test apps/electron/src/renderer/lib/__tests__/warmup.test.ts
      - run: bun run validate:ci
        env:
          # The hosted Electron TypeScript graph exceeded Node's default ~2 GiB heap.
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Verify bundled MCP provisioning and first-session onboarding
        # Uses local protocol fixtures and injected installers, without cloud keys or upstream downloads.
        # The script isolates RPC module mocks from the real transport and transcript suites.
        run: bun run test:mcp-onboarding
  workspace-migrations:
    # Unified workspace-service DDL (W1-05, #1502): static checks plus migrate-up,
    # upgrade-path, startup and EXPLAIN runs against a throwaway Postgres container.
    # No secrets: the service password only exists inside this job's container.
    name: Workspace-service migrations (Postgres)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rox_migrations
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d rox_migrations"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ROX_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/rox_migrations
      # Fail instead of silently skipping the database runs.
      ROX_TEST_PG_REQUIRED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: '1.4.2' }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun run workspace-service:test:migrations
  # W1-10 (#1507): unified gates run on every PR. Pending (sibling input not
  # landed) never fails; real violations do. The postgres:16 service backs
  # the live-DB paths (packages/test-harness postgres fixture, pgOrSkip in
  # apps/workspace-service/test) through ROX_TEST_PG_URL, so they run here
  # instead of skipping. Strict perf budgets run in bench-strict.yml.
  unified-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ROX_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: check-provenance diffs against the merge-base with
          # origin/$GITHUB_BASE_REF and fails closed when it cannot resolve it;
          # the shrink-only allowlists compare against the same base.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: '1.4.2' }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun test packages/test-harness
      - run: bun test apps/workspace-service/test e2e/unified
      # On push (main) the default base, origin/main, IS HEAD: provenance would
      # scan 0 files and the shrink-only allowlists would compare with
      # themselves (#1507 review 3). Diff the pushed range instead: the
      # pre-push tip github.event.before, or HEAD~1 when it is the all-zero
      # SHA (new branch). A before SHA missing from the clone (force push)
      # makes the checks fail closed. PRs keep origin/$GITHUB_BASE_REF.
      - name: Provenance and allowlist base for push events
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-parse HEAD~1)"
          else
            BASE="$BEFORE"
          fi
          echo "ROX_PROVENANCE_BASE=$BASE" >> "$GITHUB_ENV"
          echo "provenance / allowlist base: $BASE"
      - run: bun run scripts/check-provenance.ts
      - run: bun run scripts/run-unified-gates.ts
