name: cloud-runs-conformance

# Nightly contract guard: local always; Daytona live when secrets exist.
on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC daily
  workflow_dispatch: {}

jobs:
  conformance:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4

        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Local provider leg
        run: bun test packages/cloud-runner/src/__tests__/local-provider.test.ts

      - name: Daytona memory + live (live skipped unless DAYTONA_LIVE=1)
        env:
          DAYTONA_LIVE: ${{ secrets.DAYTONA_API_KEY && '1' || '' }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: bun test --timeout 600000 packages/cloud-runner/src/__tests__/daytona-provider.test.ts

      - name: File alert issue on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = 'Cloud Runs conformance failed (nightly)';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cloud-runs',
            });
            if (issues.length > 0) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Nightly conformance failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['cloud-runs'],
            });
