name: cloud-runs-conformance

# Nightly contract guard: local always; Daytona live when secrets exist.
on:
  schedule:
    - cron: '0 4 * * *' # 04:00 UTC daily
  workflow_dispatch: {}

jobs:
  conformance:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Local provider leg
        run: bun test packages/cloud-runner/src/__tests__/local-provider.test.ts

      - name: Daytona memory + live (live skipped unless DAYTONA_LIVE=1)
        env:
          DAYTONA_LIVE: ${{ secrets.DAYTONA_API_KEY && '1' || '' }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
        run: bun test --timeout 600000 packages/cloud-runner/src/__tests__/daytona-provider.test.ts

      - name: File alert issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Cloud Runs conformance failed (nightly)';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cloud-runs',
            });
            if (issues.length > 0) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `Nightly conformance failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['cloud-runs'],
            });
