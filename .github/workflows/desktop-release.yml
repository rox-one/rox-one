name: Desktop Release Build
on:
  push:
    branches: ['release/desktop-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.14' }
      - uses: astral-sh/setup-uv@v5
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: bun test apps/electron/src/main/__tests__/auto-update-suppress.test.ts apps/electron/src/main/__tests__/manual-release-update.test.ts
      - name: Pocket account and execution ownership regressions
        run: >-
          bun test --timeout 180000
          packages/shared/src/auth/__tests__/rox-account-authority.test.ts
          packages/shared/src/auth/__tests__/rox-pocket-client.test.ts
          apps/electron/src/main/__tests__/pocket-account-store.test.ts
          apps/electron/src/main/__tests__/pocket-account-store-durable-write.test.ts
          scripts/probes/pocket-vault-diagnostics.test.ts
          packages/server-core/src/handlers/rpc/__tests__/pocket-core-registry.test.ts
          packages/server-core/src/sessions/pocket-helper-owner.test.ts
          packages/server-core/src/sessions/pocket-session-resource-owner.test.ts
          packages/shared/src/agent/__tests__/omp-model-account-domain.test.ts
          packages/shared/src/agent/__tests__/omp-public-runtime.test.ts
      - name: Runtime restoration, mandatory OMP policy, clean skill install and migration regressions
        run: >-
          bun test --timeout 180000
          packages/shared/src/agent/__tests__/omp-history-recovery.test.ts
          packages/shared/src/agent/__tests__/omp-query-llm.test.ts
          packages/shared/src/agent/__tests__/omp-model-selection.test.ts
          packages/shared/src/agent/__tests__/omp-rpc-transport-agent.test.ts
          packages/shared/src/agent/__tests__/omp-first-run.test.ts
          packages/shared/src/agent/__tests__/omp-worker-policy.test.ts
          packages/shared/src/agent/__tests__/omp-native-policy.test.ts
          packages/shared/src/agent/__tests__/omp-permission-mode.test.ts
          packages/shared/src/agent/__tests__/omp-startup-lifecycle.test.ts
          packages/shared/src/agent/__tests__/omp-lifecycle-hardening.test.ts
          packages/shared/src/agent/backend/__tests__/omp-session-policy.test.ts
          packages/server-core/src/sessions/resume-history.test.ts
          packages/server-core/src/sessions/permission-mode.test.ts
          packages/server-core/src/handlers/rpc/__tests__/browser-credential-import.test.ts
          packages/server-core/src/handlers/rpc/__tests__/browser-profile-import.test.ts
          packages/server-core/src/handlers/rpc/__tests__/browser-data-auto-import.test.ts
          packages/shared/src/browser/__tests__/profile-native-credentials.test.ts
          packages/shared/src/collaboration/__tests__/durable-store.test.ts
          apps/electron/src/main/__tests__/browser-credential-vault-keys.test.ts
          apps/electron/src/main/__tests__/browser-credential-permissions.test.ts
          packages/shared/src/config/__tests__/env.test.ts
          packages/shared/src/config/__tests__/legacy-config-import.test.ts
          packages/shared/src/context-docs
          packages/shared/src/skills/__tests__/bundled.test.ts
          packages/shared/src/skills/__tests__/vendor-security.test.ts
          packages/shared/src/skills/__tests__/browser-helper-security.test.ts
          packages/shared/src/skills/__tests__/compound-helper-security.test.ts
          packages/shared/src/skills/__tests__/gstack-security.test.ts
          packages/shared/src/skills/__tests__/gstack-boundaries.test.ts
          packages/shared/src/skills/__tests__/gstack-root-helpers.test.ts
          packages/shared/src/skills/__tests__/gstack-browse-io.test.ts
          packages/shared/src/skills/__tests__/gstack-state-security.test.ts
          packages/shared/src/skills/__tests__/gstack-design-security.test.ts
          packages/shared/src/skills/__tests__/autoplan-security.test.ts
          packages/shared/src/skills/__tests__/vendor-provenance.test.ts
          scripts/probes/omp-worker-loop.test.ts
          packages/shared/src/toolchain/__tests__/acpx.test.ts
          packages/shared/src/credentials/backends/__tests__/keychain-master-key.test.ts
          packages/shared/src/agent/core/__tests__/rox-config-paths.test.ts
          scripts/configuration-guide.test.ts
          scripts/electron-build-resources.test.ts
        env:
          ROX_OMP_TEST_TIMEOUT_MS: '30000'
      - run: bun run validate:ci
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: bun test packages/shared/src/agent/__tests__/omp-rpc-transport.test.ts packages/shared/src/agent/__tests__/omp-rpc-frames.test.ts packages/shared/src/agent/__tests__/omp-session-flow.test.ts scripts/build/__tests__ packages/shared/src/voice packages/server-core/src/handlers/rpc/__tests__/voice.test.ts apps/electron/src/renderer/lib/__tests__/message-tts.test.ts
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: darwin, arch: arm64 }
          - { runner: windows-2025, platform: win32, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Clear prior native proof receipt
        run: node -e "require('node:fs').rmSync('reports/pocket-sso-native-vault/'+process.platform+'.json',{force:true})"
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.14' }
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun scripts/desktop-release.ts
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_LINK: ${{ secrets[matrix.platform == 'darwin' && 'MAC_CSC_LINK' || 'WIN_CSC_LINK'] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.platform == 'darwin' && 'MAC_CSC_KEY_PASSWORD' || 'WIN_CSC_KEY_PASSWORD'] }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Actual Keychain or DPAPI store restart
        run: bun scripts/probes/run-pocket-vault-native.ts
      - name: Native vault diagnostic receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-native-vault-${{ matrix.platform }}-${{ matrix.arch }}
          path: reports/pocket-sso-native-vault/${{ matrix.platform }}.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/electron/release/Rox-*.dmg
            apps/electron/release/Rox-*.zip
            apps/electron/release/Rox-*.exe
            apps/electron/release/*.blockmap
            apps/electron/release/manifest-*.json
            apps/electron/release/latest*.yml
            reports/pocket-sso-native-vault/*.json
          if-no-files-found: error
          retention-days: 14
