name: ESLint Workspace Ratchet
# DX-03: ESLint coverage for the workspaces that had no config (server-core, core, webui, viewer,
# cli, messaging-gateway, messaging-discord-worker, messaging-whatsapp-worker, browser-intel,
# test-harness). scripts/eslint-workspace-ratchet.ts lints each with scripts/eslint/base-config.mjs
# and gates the result against eslint-baselines/workspaces/<name>.json: counts may only go down.
# On pull_request the PR's baselines are also compared with the base commit's copy, so a PR cannot
# raise a ceiling by editing a baseline in the same PR, and `git diff -M` against the base commit
# catches a rename that carries counts out of the counted set (or a config `ignores` that drops a
# counted file). Owners approve such growth with the `eslint-workspace-override` label.
# Separate job: it does not touch the timing-sensitive validate lane.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eslint-workspaces-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  workspaces:
    name: ESLint workspace ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # pull_request checks out the merge commit; depth 2 brings its parents (HEAD^1 = base).
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: '1.4.2' }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      # eslint needs no install scripts; skipping them keeps this job hermetic.
      - run: bun install --frozen-lockfile --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Check the merge commit's base is available
        if: github.event_name == 'pull_request'
        run: |
          git rev-parse --verify --quiet 'HEAD^2^{commit}' >/dev/null || { echo "HEAD is not the PR merge commit"; exit 1; }
          git rev-parse --verify 'HEAD^1^{commit}'
      - name: Ratchet unit tests
        run: bun test scripts/__tests__/eslint-workspace-ratchet.test.ts
      - name: Ratchet (per-rule, per-file counts may only go down)
        if: github.event_name != 'pull_request'
        run: bun scripts/eslint-workspace-ratchet.ts --check
      - name: Ratchet vs the base commit's baselines (merge commit's first parent)
        if: github.event_name == 'pull_request'
        env:
          RATCHET_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'eslint-workspace-override') && '1' || '0' }}
        run: bun scripts/eslint-workspace-ratchet.ts --check --base 'HEAD^1'