name: factory-apply-567-catalog-deeplinks
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory/ship-rox-gg-catalog-deeplinks-a5fb8016
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decode zlib patch and apply
        run: |
          python3 - <<'PY'
          import base64, pathlib, zlib, subprocess
          b64 = pathlib.Path('.factory/567/remaining.patch.zlib.b64').read_text().strip()
          patch = zlib.decompress(base64.b64decode(b64))
          pathlib.Path('.factory/567/remaining.patch').write_bytes(patch)
          print('patch bytes', len(patch))
          subprocess.check_call(['git', 'apply', '.factory/567/remaining.patch'])
          print('applied ok')
          PY
      - name: Commit product changes and remove factory scaffolding
        run: |
          git config user.name "id-2"
          git config user.email "gronxie@yandex.com"
          rm -rf .factory/567
          rm -f .github/workflows/factory-apply-567-catalog-deeplinks.yml
          git add -A
          git status
          git commit -m "fix(shell): MeetingsPage load-by-id + tasks.notFound i18n (#567 #568)"
          git push origin HEAD:factory/ship-rox-gg-catalog-deeplinks-a5fb8016
