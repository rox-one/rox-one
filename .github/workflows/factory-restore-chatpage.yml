name: factory-restore-chatpage
on:
  push:
    branches: [cursor/perf-chat-secondary-lazy-c9d2]
    paths:
      - .factory/ship-rox-perf-chat-secondary-lazy/ChatPage.tsx.gz.b64
      - .github/workflows/factory-restore-chatpage.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/perf-chat-secondary-lazy-c9d2
          fetch-depth: 0
      - name: Restore ChatPage from gzip+b64
        run: |
          set -euo pipefail
          SRC=.factory/ship-rox-perf-chat-secondary-lazy/ChatPage.tsx.gz.b64
          DST=apps/electron/src/renderer/pages/ChatPage.tsx
          if ! test -f "$SRC"; then echo "missing payload"; exit 1; fi
          if grep -q 'React.lazy' "$DST" 2>/dev/null; then
            echo "already restored"; exit 0
          fi
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib
          src = pathlib.Path('.factory/ship-rox-perf-chat-secondary-lazy/ChatPage.tsx.gz.b64')
          dst = pathlib.Path('apps/electron/src/renderer/pages/ChatPage.tsx')
          raw = gzip.decompress(base64.b64decode(src.read_text().strip()))
          dst.write_bytes(raw)
          print('wrote', len(raw), 'sha16', hashlib.sha256(raw).hexdigest()[:16])
          text = raw.decode()
          assert 'React.lazy' in text
          assert 'SessionWorkflowEditor' in text
          assert 'KnowledgeSurfacePage' in text
          assert 'SessionGitOutline' in text
          assert 'deriveSessionMindMap' not in text
          PY
      - name: Commit and scrub factory artifacts
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/electron/src/renderer/pages/ChatPage.tsx
          rm -f .factory/ship-rox-perf-chat-secondary-lazy/ChatPage.tsx.gz.b64
          rm -f .github/workflows/factory-restore-chatpage.yml
          git add -A .factory/ship-rox-perf-chat-secondary-lazy .github/workflows/factory-restore-chatpage.yml || true
          if git diff --cached --quiet; then echo nothing; exit 0; fi
          git commit -m "$(cat <<'EOF'
          perf(chat): lazy-load secondary ChatPage views (xyflow, knowledge, mindmap)

          Keep ChatPage and the default standard transcript path eager. React.lazy +
          Suspense for SessionWorkflowEditor (@xyflow), KnowledgeSurfacePage, and
          SessionGitOutline so those chunks load only when the entity tab is selected.
          Drop unused eager deriveSessionMindMap from the chat module graph.

          Factory: ship-rox-perf-chat-secondary-lazy. Draft only.
          EOF
          )"
          git push origin HEAD:cursor/perf-chat-secondary-lazy-c9d2
