name: factory-restore-mindmap-host
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: factory/ship-rox-gg-notes-knowledge-residuals-a4ea9a22
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore MindMapHost.tsx from zlib payload
        run: |
          python3 <<'PY'
          import zlib, base64
          from pathlib import Path
          zb = Path('.factory/MindMapHost.tsx.z9.b64').read_text().strip()
          out = Path('apps/electron/src/renderer/mindmap/MindMapHost.tsx')
          data = zlib.decompress(base64.b64decode(zb))
          assert b'motion-safe:animate-pulse' in data
          out.write_bytes(data)
          print('restored', out, 'bytes', len(data))
          PY
      - name: Commit and push
        run: |
          git config user.name "id-2"
          git config user.email "gronxie@yandex.com"
          git add apps/electron/src/renderer/mindmap/MindMapHost.tsx
          git commit -m "fix(notes): restore MindMapHost with motion-safe:animate-pulse (#992)" || echo "no changes"
          git push origin HEAD:factory/ship-rox-gg-notes-knowledge-residuals-a4ea9a22
