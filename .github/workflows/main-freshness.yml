# Проверка-носитель правила «строгая свежесть ветки» для main.
# Тривиальная и мгновенная: сама ничего не проверяет, но включает механизм,
# при котором устаревшую ветку нельзя слить, пока она не обновлена на актуальный main.
name: main-freshness
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  freshness:
    name: freshness
    # 2026-10-13: пилот — уводим гейт с GitHub-хостед очереди (затор ~75 мин);
    # Blacksmith уже доказан в этом репо (cloud-runs-conformance, зелёный 13.10 11:38Z).
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - run: echo "ok"
