# DX-04: the repository test runner (scripts/test-all.ts) had no workflow.
# This is the single nightly "is the tree still alive" command: it runs the
# whole aggregate suite in bounded parallel against the known-red baseline
# (scripts/test-baseline.json), so only *new* failures are surfaced.
#
# It is deliberately non-blocking for PRs: the workflow only runs on a schedule
# and manual dispatch, never on pull_request, and the suite step itself keeps
# continue-on-error. The one hard gate is the test-debt ratchet step: the
# recorded knownRed[] must not exceed knownRedCeiling, so the checked-in debt
# can only fall.
name: nightly-test-all

on:
  schedule:
    # 03:00 UTC every day.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      concurrency:
        description: 'Parallel suite workers'
        required: false
        default: '4'
      strict:
        description: 'Fail on any red suite, ignoring the known-red baseline'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-test-all
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    name: nightly-test-all (shard ${{ matrix.shard }}/2)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      # Live-DB suites resolve the throwaway container instead of skipping.
      ROX_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install exact lockfile
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Chromium and browser runtime dependencies
        run: bunx playwright install --with-deps chromium
      - name: Bind every browser harness to installed Chromium
        run: |
          bun -e '
            import { chromium } from "@playwright/test";
            import { appendFileSync, existsSync } from "node:fs";
            const browserPath = chromium.executablePath();
            if (!existsSync(browserPath)) throw new Error("Installed Chromium executable missing");
            const environmentFile = process.env.GITHUB_ENV;
            if (!environmentFile) throw new Error("GitHub environment file missing");
            appendFileSync(environmentFile, ["CHROMIUM_EXECUTABLE", "LEARNING_CHROMIUM_PATH", "ROX_BROWSER_PATH"].map(name => `${name}=${browserPath}`).join("\n") + "\n");
          '
      - name: Run the aggregate suite against the known-red baseline
        id: test-all
        # The runner's exit code is 1 on new failures and on a ratchet breach;
        # `continue-on-error` keeps this suite step non-blocking so it never
        # hides the report. The dedicated ratchet step is the one hard gate.
        continue-on-error: true
        env:
          CONCURRENCY: ${{ github.event.inputs.concurrency || '4' }}
        run: bun scripts/test-all.ts --shard "${{ matrix.shard }}/2" --concurrency "$CONCURRENCY" --ratchet ${{ github.event.inputs.strict == 'true' && '--strict' || '' }} | tee test-all.stdout.json
      - name: Publish new-regression signal
        if: always()
        run: |
          bun -e '
            import { readFileSync, existsSync, readdirSync, statSync } from "node:fs";
            import { join } from "node:path";
            import { appendFileSync } from "node:fs";
            const root = "work/test-all";
            if (!existsSync(root)) { console.log("::warning::test-all produced no report directory"); process.exit(0); }
            const runs = readdirSync(root).map(name => join(root, name)).filter(path => statSync(path).isDirectory()).sort((a, b) => statSync(b).mtimeMs - statSync(a).mtimeMs);
            if (!runs.length) { console.log("::warning::test-all produced no report"); process.exit(0); }
            const report = JSON.parse(readFileSync(join(runs[0], "report.json"), "utf8"));
            const summary = report.summary;
            const lines = [
              `### nightly test-all`,
              ``,
              `- suites: ${summary.expected} (passed ${summary.passed}, failed ${summary.failed}, blocked ${summary.blocked})`,
              `- new failures: **${summary.newFailures}**`,
              `- known-red (baseline): ${summary.knownRed}`,
              `- stale baseline entries: ${summary.stalePass}`,
              ``,
              `report: \`${runs[0]}/report.json\` (revision ${report.input?.head ?? "unknown"})`,
            ];
            if (report.baseline?.newFailures?.length) lines.push("", "New failures:", ...report.baseline.newFailures.map(path => `- \`${path}\``));
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            if (summary.newFailures > 0) {
              console.log(`::error::${summary.newFailures} new test failure(s); see the uploaded report artifact`);
            } else {
              console.log("::notice::no new test failures");
            }
          '
      - name: Enforce the test-debt ratchet ceiling
        if: always()
        # The nightly's one hard gate: the recorded knownRed[] in
        # scripts/test-baseline.json may not exceed knownRedCeiling. The suite
        # step above keeps continue-on-error, so only this step fails the job,
        # and the workflow never runs on pull_request, so no PR is blocked.
        run: |
          bun -e '
            import { readFileSync, existsSync } from "node:fs";
            if (!existsSync("test-all.stdout.json")) { console.log("::warning::test-all produced no receipt to ratchet"); process.exit(0); }
            let receipt;
            try { receipt = JSON.parse(readFileSync("test-all.stdout.json", "utf8")); }
            catch { console.log("::warning::test-all receipt is not readable JSON"); process.exit(0); }
            const ratchet = receipt?.ratchet;
            if (!ratchet) { console.log("::warning::test-all receipt carries no ratchet verdict"); process.exit(0); }
            if (ratchet.exceeded) { console.log(`::error::${ratchet.line}`); process.exit(1); }
            console.log(`::notice::${ratchet.line}`);
          '
      - name: Upload test-all evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-test-all-${{ github.sha }}-shard${{ matrix.shard }}
          path: work/test-all/
          if-no-files-found: warn
          retention-days: 14