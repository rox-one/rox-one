name: Perf Budgets
on:
  push:
    branches: [main]
    paths:
      - 'apps/electron/src/renderer/perf/**'
      - 'apps/electron/src/renderer/main.tsx'
      - 'packages/server-core/src/observability/**'
      - 'packages/server-core/src/transport/server.ts'
      - 'scripts/bench/renderer-perf-report.ts'
      - 'apps/electron/scripts/perf/**'
      - 'apps/electron/src/main/index.ts'
      - 'apps/electron/src/main/startup-marks.ts'
      - 'apps/electron/src/main/shell-env.ts'
      - 'apps/electron/src/main/windows-bootstrap.ts'
      - 'apps/electron/src/shared/startup-perf.ts'
      - 'packages/shared/src/skills/bundled*.ts'
      - '.github/workflows/perf-budgets.yml'
  pull_request:
    paths:
      - 'apps/electron/src/renderer/perf/**'
      - 'apps/electron/src/renderer/main.tsx'
      - 'packages/server-core/src/observability/**'
      - 'packages/server-core/src/transport/server.ts'
      - 'scripts/bench/renderer-perf-report.ts'
      - 'apps/electron/scripts/perf/**'
      - 'apps/electron/src/main/index.ts'
      - 'apps/electron/src/main/startup-marks.ts'
      - 'apps/electron/src/main/shell-env.ts'
      - 'apps/electron/src/main/windows-bootstrap.ts'
      - 'apps/electron/src/shared/startup-perf.ts'
      - 'packages/shared/src/skills/bundled*.ts'
      - '.github/workflows/perf-budgets.yml'
  workflow_dispatch:
jobs:
  budgets:
    runs-on: [self-hosted, macos-toolchain]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.2' }
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - run: bun run test:perf-budgets
      - name: Runtime report (2000 sessions)
        run: bun run scripts/bench/renderer-perf-report.ts --out renderer-perf-2000.md
      - name: Bundle profile (separate clock)
        run: bun run scripts/bench/renderer-perf-report.ts --bundle --out renderer-perf-bundle.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-perf-reports
          path: |
            renderer-perf-2000.md
            renderer-perf-bundle.md
  # PERF-01: launch the built app and compare startup marks with the audit
  # budgets (CI ×4). Shell-first boot landed (PERF-01): the shell window is
  # created before the RPC server bootstrap, so `window-created` now precedes
  # `server-ready` and warm FMP roughly halved. Still report-only because the
  # `window-created` mark is dominated by Electron process launch + main-bundle
  # evaluation (≈1.0 s to `main:entry` on the runner) — flip this step to
  # `--strict` (and drop `continue-on-error`) once the ×4 budget is cleared.
  electron-startup:
    runs-on: [self-hosted, macos-toolchain]
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.2' }
      - uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Build Electron app
        run: bun run electron:build
      - name: Startup bench (report-only)
        run: bun run perf:startup -- --runs 3 --ci --md electron-startup.md --out electron-startup.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: electron-startup-bench
          path: |
            electron-startup.md
            electron-startup.json
