name: Pocket Native Vault Proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pocket-native-vault-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-vault:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: darwin }
          - { runner: windows-2025, platform: win32 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Clear prior native proof receipt
        run: node -e "require('node:fs').rmSync('reports/pocket-sso-native-vault/'+process.platform+'.json',{force:true})"
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.14' }
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Store and diagnostic regressions
        run: bun test apps/electron/src/main/__tests__/pocket-account-store-durable-write.test.ts scripts/probes/pocket-vault-diagnostics.test.ts
      - name: macOS store and symlink regressions
        if: matrix.platform == 'darwin'
        run: bun test apps/electron/src/main/__tests__/pocket-account-store.test.ts
      - name: Actual Keychain or DPAPI store restart
        run: bun scripts/probes/run-pocket-vault-native.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-native-vault-${{ matrix.platform }}
          path: reports/pocket-sso-native-vault/${{ matrix.platform }}.json
          if-no-files-found: warn
          retention-days: 14
