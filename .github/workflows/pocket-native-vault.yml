name: Pocket Native Vault Proof
on:
  push:
    branches: ['codex/pocket-id-sso']
    paths:
      - '.github/workflows/pocket-native-vault.yml'
      - 'apps/electron/src/main/pocket-account-store.ts'
      - 'apps/electron/src/main/__tests__/pocket-account-store*'
      - 'scripts/probes/pocket-vault-*'
      - 'scripts/probes/run-pocket-vault-native.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pocket-native-vault-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-vault:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: darwin }
          - { runner: windows-2025, platform: win32 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24' }
      - name: Clear prior native proof receipt
        run: node -e "require('node:fs').rmSync('reports/pocket-sso-native-vault/'+process.platform+'.json',{force:true})"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: '1.4.2' }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Store and diagnostic regressions
        run: bun test apps/electron/src/main/__tests__/pocket-account-store-durable-write.test.ts scripts/probes/pocket-vault-diagnostics.test.ts
      - name: macOS store and symlink regressions
        if: matrix.platform == 'darwin'
        run: bun test apps/electron/src/main/__tests__/pocket-account-store.test.ts
      - name: Actual Keychain or DPAPI store restart
        run: bun scripts/probes/run-pocket-vault-native.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pocket-native-vault-${{ matrix.platform }}
          path: reports/pocket-sso-native-vault/${{ matrix.platform }}.json
          if-no-files-found: warn
          retention-days: 14
