name: product-tour-native

on:
  pull_request:
    paths:
      - '.github/workflows/product-tour-native.yml'
      - 'apps/electron/src/renderer/**'
      - 'packages/ui/src/**'
      - 'packages/server-core/src/authority/**'
      - 'apps/electron/src/main/**'
      - 'apps/electron/src/preload/**'
      - 'apps/electron/vite.config.ts'
      - 'scripts/electron-build-*.ts'
      - 'scripts/product-tour/**'
      - 'tests/e2e/product-tour/**'
      - 'package.json'
      - 'apps/electron/package.json'
      - 'bun.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-tour-native.yml'
      - 'apps/electron/src/renderer/**'
      - 'packages/ui/src/**'
      - 'packages/server-core/src/authority/**'
      - 'apps/electron/src/main/**'
      - 'apps/electron/src/preload/**'
      - 'apps/electron/vite.config.ts'
      - 'scripts/electron-build-*.ts'
      - 'scripts/product-tour/**'
      - 'tests/e2e/product-tour/**'
      - 'package.json'
      - 'apps/electron/package.json'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Main pushes get their own group per commit. With one group per ref, a push run was cancelled the
  # moment the next push entered the group — 81 of the last 84 push runs on 2026-10-14..15 were
  # cancelled that way, which is how this workflow stayed red for six days while every PR showed
  # "cancelled" instead of the failure. PRs keep one stable group per refs/pull/<n>/merge, so a newer
  # push to the same PR still cancels the older run — the behaviour the old expression was written for.
  group: product-tour-native-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: true

jobs:
  browser-and-domain:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install exact lockfile
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Chromium and browser runtime dependencies
        run: bunx playwright install --with-deps chromium
      - name: Bind every browser harness to installed Chromium
        run: |
          bun -e '
            import { chromium } from "@playwright/test";
            import { appendFileSync, existsSync } from "node:fs";
            const browserPath = chromium.executablePath();
            if (!existsSync(browserPath)) throw new Error("Installed Chromium executable missing");
            const environmentFile = process.env.GITHUB_ENV;
            if (!environmentFile) throw new Error("GitHub environment file missing");
            appendFileSync(environmentFile, ["CHROMIUM_EXECUTABLE", "LEARNING_CHROMIUM_PATH", "ROX_BROWSER_PATH"].map(name => `${name}=${browserPath}`).join("\n") + "\n");
          '
      - name: Verify product-tour policies, native domain adapters and browser harnesses
        run: bun run test:product-tour
      - name: Exercise production App, scoped targets and isolated native stores
        env:
          # Bind the same App assertions to a completed source-fingerprinted
          # build; cold optimizer chunk replacement is not startup evidence.
          PRODUCT_TOUR_APPLICATION_STATIC: '1'
        run: bun run test:product-tour:e2e
      - name: Upload browser and domain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-tour-browser-and-domain-${{ github.sha }}
          path: |
            test-results/product-tour/application.json
            test-results/product-tour/application/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  fresh-native-smoke:
    name: fresh-native-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-6vcpu-macos-15, blacksmith-4vcpu-windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - name: Record candidate and installed runtimes
        run: |
          git rev-parse HEAD
          bun --version
          node --version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install exact lockfile and real Electron executable
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Warm the Windows PowerShell host
        # Cold Windows PowerShell start-up (Defender inspection of a fresh
        # process) is the only reason the first OS probe used to need a long
        # budget; warm it once before the ownership probe runs.
        if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -Command ""
      - name: Verify actual OS-owner startup and reopen boundaries
        run: bun test --timeout 30000 ./packages/server-core/src/authority/__tests__/rox-readiness-ui-001.windows-owner.test.ts
      - name: Build the real desktop main, preload, renderer and resources
        run: bun run electron:build
      - name: Record source changes generated by the desktop build
        run: |
          bun -e '
            import { spawnSync } from "node:child_process";
            import { createHash } from "node:crypto";
            import { mkdirSync, writeFileSync } from "node:fs";
            const git = args => {
              const result = spawnSync("git", args);
              if (result.status !== 0) throw new Error("Cannot record build source provenance");
              return result.stdout;
            };
            const diff = git(["diff", "--no-ext-diff", "--binary", "HEAD"]);
            const report = {
              sourceSha: git(["rev-parse", "HEAD"]).toString().trim(),
              trackedStatus: git(["status", "--porcelain", "--untracked-files=no"]).toString(),
              trackedNumstat: git(["diff", "--numstat", "HEAD"]).toString(),
              trackedDiffBytes: diff.length,
              trackedDiffSha256: createHash("sha256").update(diff).digest("hex")
            };
            mkdirSync("test-results/product-tour", { recursive: true });
            writeFileSync("test-results/product-tour/native-build-source.json", JSON.stringify(report, null, 2) + "\n");
            console.log(JSON.stringify(report));
          '
      - name: Exercise fresh native setup and absence of automatic tour
        # This launches dist/main.cjs with an isolated profile, not a browser fixture.
        # The runner leaves full NATIVE-01/02/03 acceptance NOT_RUN in its report.
        env:
          # The Playwright CLI echoes the launched Electron child's own stdout/stderr
          # (`pw:browser [pid][out]`). It is the only trace of how far a fresh-profile
          # product boot reached before the first window, and this lane has no other.
          DEBUG: pw:browser
          # Keep the isolated profile on disk so a red lane ships userData logs in the artifact.
          ROX_PRODUCT_TOUR_NATIVE_KEEP_PROFILE: '1'
        run: bun scripts/product-tour/run-native.ts
      - name: Stop the native app and release its profile handles
        # The lane deliberately keeps the smoke's Electron profile for diagnostics
        # (ROX_PRODUCT_TOUR_NATIVE_KEEP_PROFILE=1) under test-results/product-tour/native.
        # A red run can leave the app alive: Playwright's own shutdown is bounded and a
        # deadline kill lands after the profile is already open. Windows then refuses to
        # read the profile's Chromium SQLite/leveldb files, whose handles are opened
        # without FILE_SHARE_DELETE, so zip creation in the upload step died with EBUSY
        # instead of preserving the evidence. Stop the app here, then wait until its
        # handles are really gone before anything reads the profile.
        if: always()
        continue-on-error: true
        run: |
          bun -e '
            import { spawnSync } from "node:child_process";
            import { existsSync, openSync, closeSync, readdirSync } from "node:fs";
            import { join, resolve } from "node:path";

            const profile = resolve("test-results/product-tour/native");

            const stop = (command, args) => {
              const result = spawnSync(command, args, { encoding: "utf8", windowsHide: true });
              const output = ((result.stdout || "") + (result.stderr || "")).trim().split("\n").join(" | ");
              console.log(command + " " + args.join(" ") + " -> exit " + String(result.status) + (output ? ": " + output : ""));
            };
            // The smoke step is the only step that launches apps/electron/dist/main.cjs,
            // so the absolute path of that entrypoint is what identifies its processes.
            //
            // A red run really does outlive its job: Electron main processes from this
            // lane have been seen reparented to the init process (ppid 1) after the job
            // finished, which is the state that holds the kept profile open on Windows.
            const main = resolve("apps/electron/dist/main.cjs");
            if (process.platform === "win32") {
              // taskkill filters on the image name only, which is exact enough on the
              // ephemeral single-tenant runner this lane uses. /T also reaches the
              // Electron helper processes (GPU, renderer, utility); the main process
              // alone is not what keeps the profile files open.
              stop("taskkill.exe", ["/F", "/T", "/IM", "electron.exe"]);
            } else {
              // Scoped to this checkout so a side-by-side worktree on the same host keeps
              // its own app.
              stop("pkill", ["-f", main]);
            }

            const files = [];
            const collect = directory => {
              if (!existsSync(directory)) return;
              for (const entry of readdirSync(directory, { withFileTypes: true })) {
                const path = join(directory, entry.name);
                if (entry.isDirectory()) collect(path);
                else if (entry.isFile()) files.push(path);
              }
            };
            collect(profile);

            const stillLocked = () => files.filter(path => {
              try { closeSync(openSync(path, "r")); return false; } catch { return true; }
            });
            const pause = milliseconds => new Promise(done => setTimeout(done, milliseconds));
            const deadline = Date.now() + 30_000;
            let unreleased = stillLocked();
            while (unreleased.length && Date.now() < deadline) { await pause(1_000); unreleased = stillLocked(); }
            if (unreleased.length) console.log("::warning::" + unreleased.length + " of " + files.length + " file(s) under test-results/product-tour/native stayed unreadable for 30 s; the staging step names each one");
            else console.log("::notice::all " + files.length + " native evidence file(s) are readable again");
          '

      - name: Stage the native evidence that is still readable
        # Hand the upload step a copy instead of the live profile: every staged byte has
        # been read once already, so a Windows lock (EBUSY) or a slow antivirus scan of
        # the freshly written profile can no longer break zip creation. A file that stays
        # unreadable is skipped and named in native-evidence-manifest.json, so the
        # artifact keeps every readable file and the report says what was lost.
        if: always()
        continue-on-error: true
        run: |
          bun -e '
            import { appendFileSync, copyFileSync, existsSync, mkdirSync, readdirSync, rmSync, writeFileSync } from "node:fs";
            import { dirname, join, relative, resolve } from "node:path";

            const evidence = resolve("test-results/product-tour/native");
            const staging = resolve("test-results/product-tour/native-upload");
            const copied = [];
            const skipped = [];
            let nonRegular = 0;

            // A reused workspace must not ship the previous run as if it were this one.
            rmSync(staging, { recursive: true, force: true });

            const copyOne = path => {
              const relativePath = relative(evidence, path);
              const destination = join(staging, relativePath);
              try {
                mkdirSync(dirname(destination), { recursive: true });
                copyFileSync(path, destination);
                copied.push(relativePath);
              } catch (error) {
                // A copy that died mid-read leaves a truncated file; a missing entry that
                // the manifest names is honest, a half-written one is not.
                rmSync(destination, { force: true });
                skipped.push({ path: relativePath, code: error.code || String(error.message) });
              }
            };
            const copyTree = directory => {
              if (!existsSync(directory)) return;
              for (const entry of readdirSync(directory, { withFileTypes: true })) {
                const path = join(directory, entry.name);
                if (entry.isDirectory()) copyTree(path);
                else if (entry.isFile()) copyOne(path);
                else nonRegular += 1;
              }
            };
            copyTree(evidence);

            mkdirSync(staging, { recursive: true });
            writeFileSync(join(staging, "native-evidence-manifest.json"), JSON.stringify({
              scope: "Readable copy of the native smoke evidence; locked files are named here, never silently dropped",
              platform: process.platform,
              sourceDirectory: "test-results/product-tour/native",
              copiedFiles: copied.length,
              skippedFiles: skipped.length,
              skippedNonRegularEntries: nonRegular,
              skipped,
              generatedAt: new Date().toISOString(),
            }, null, 2) + "\n");
            for (const item of skipped) console.log("::warning::native evidence unreadable: " + item.path + " (" + item.code + ")");
            console.log("::notice::staged " + copied.length + " readable native evidence file(s); skipped " + skipped.length + " unreadable");
            if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              "### native smoke evidence",
              "",
              "- readable files staged: " + copied.length,
              "- unreadable files skipped: " + skipped.length,
              ...skipped.slice(0, 25).map(item => "- `" + item.path + "` (" + item.code + ")"),
              "",
            ].join("\n") + "\n");
          '

      - name: Upload native smoke evidence and unresolved platform gates
        # The verdict of this lane is the smoke run above; a missing artifact must never
        # turn a failing run into an upload crash or a passing run red, so this step
        # continues on error and reports what it could not read instead.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-tour-native-${{ matrix.os }}-${{ github.sha }}
          # The staged tree replaces test-results/product-tour/native/: its files were read
          # once already, so a Windows lock cannot break the zip. The three top-level
          # reports are written by this job's own processes and are never held open.
          path: |
            test-results/product-tour/native-readiness.json
            test-results/product-tour/native.json
            test-results/product-tour/native-build-source.json
            test-results/product-tour/native-upload/
          if-no-files-found: warn
          retention-days: 14
