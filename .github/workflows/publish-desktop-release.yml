name: Publish Desktop Release
on:
  workflow_dispatch:
    inputs:
      run-id:
        description: Successful Desktop Release Build run ID
        required: true
        type: string
      tag:
        description: Existing draft release version tag
        required: true
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-desktop-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Verify build provenance and publish artifacts
        run: bun scripts/publish-desktop-release.ts "$RUN_ID" "$RELEASE_TAG"
        env:
          RUN_ID: ${{ inputs.run-id }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
