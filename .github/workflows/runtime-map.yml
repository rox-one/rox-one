name: Runtime map native evidence
on:
  pull_request:
    paths:
      - 'packages/core/src/runtime-trace/**'
      - 'packages/shared/src/agent/omp-runtime*'
      - 'packages/shared/src/agent/omp-agent.ts'
      - 'packages/server-core/src/sessions/runtime-trace/**'
      - 'scripts/probes/*runtime-map*'
      - 'tests/e2e/runtime-map/**'
      - '.github/workflows/runtime-map.yml'
permissions:
  contents: read
jobs:
  native-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '24' }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: '1.3.14' }
      - run: bun install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Prepare verified native package and pinned dependency graph
        run: bun scripts/probes/prepare-runtime-map-omp.ts "$RUNNER_TEMP/runtime-map-omp"
      - name: Exercise actual native parent, nested task and restricted worker
        run: bun scripts/probes/runtime-map-native-loop.ts "$RUNNER_TEMP/runtime-map-native-loop.json"
        env:
          ROX_OMP_PACKAGE_DIR: ${{ runner.temp }}/runtime-map-omp/package
      - name: Verify observation and projection boundaries
        run: bun test packages/core/src/runtime-trace packages/shared/src/agent/__tests__/omp-runtime-observer.test.ts packages/server-core/src/sessions/runtime-trace packages/server-core/src/handlers/rpc/__tests__/runtime-trace.test.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-map-native-loop
          path: ${{ runner.temp }}/runtime-map-native-loop.json
          if-no-files-found: error
