name: UI-001 Recovery

on:
  pull_request:
    paths:
      - 'apps/electron/src/renderer/**'
      - 'apps/electron/src/shared/**'
      - 'docs/final-readiness/execution/cloud/OWNER-UI-001/**'
      - '.github/workflows/ui-001-recovery.yml'
      - 'bun.lock'
  push:
    branches: [main]
    paths:
      - 'apps/electron/src/renderer/**'
      - 'apps/electron/src/shared/**'
      - 'docs/final-readiness/execution/cloud/OWNER-UI-001/**'
      - '.github/workflows/ui-001-recovery.yml'
      - 'bun.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-001-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-recovery:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Shell, parser, persistence and navigation regression
        run: >-
          bun test --timeout 30000
          apps/electron/src/renderer/components/app-shell/__tests__
          apps/electron/src/shared/__tests__
          apps/electron/src/renderer/contexts/__tests__
          apps/electron/src/renderer/lib/__tests__/shell-layout-preferences.test.ts
          apps/electron/src/renderer/lib/__tests__/nav-helpers.test.ts
          apps/electron/src/renderer/atoms/rox-readiness-ui-001.layout.test.ts
      - name: Install isolated Chromium
        run: bunx playwright install chromium
      - name: Mounted NavigationProvider and browser history
        run: bun docs/final-readiness/execution/cloud/OWNER-UI-001/rox-readiness-ui-001.navigation-browser.ts
      - name: Resource, editor and cross-window persistence recovery
        run: bun docs/final-readiness/execution/cloud/OWNER-UI-001/rox-readiness-ui-001.recovery-browser.ts
      - name: Retry, lazy loading and resize callbacks
        env:
          ROX_UI001_BROWSER_TEST: '1'
          ROX_UI001_BROWSER_CHANNEL: chromium
        run: bun test --timeout 60000 apps/electron/src/renderer/components/app-shell/__tests__/rox-readiness-ui-001.browser.test.ts
      - name: Native surface renderer ownership and suppression
        run: bun test --timeout 60000 apps/electron/src/renderer/components/app-shell/__tests__/native-surface-owners.browser.test.ts
      - name: Preserve component fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-001-component-evidence-${{ github.sha }}
          path: docs/final-readiness/execution/cloud/OWNER-UI-001/verification/browser
          if-no-files-found: ignore

# These jobs prove renderer and IPC-boundary fixture behavior. Installed
# Windows 10/11, native macOS compositor and actual hosted service acceptance
# remain separately required by the unchanged UI-001 task contract.
