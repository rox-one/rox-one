name: UI Lint Ratchet
# UI-A2 (#1568): rox/* ESLint token rules + stylelint, ratcheted per rule and per file against
# eslint-baselines/ui-tokens.json. Counts may only go down; a rule flips to error at 0.
# Runs on every PR: any UI file can add a raw z-index, colour or radius.
# On pull_request the PR's baseline is also compared with the base branch's copy, so a PR cannot
# raise a count (or weaken a rule's severity) by editing the baseline in the same PR. Owners
# approve such growth with the `ui-baseline-override` label (see eslint-baselines/README.md).
# The comparison uses the merge commit's own first parent (HEAD^1: the base commit this merge was
# built on), not the moving base-branch tip, so re-runs and races compare like with like.
on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: adding or removing `ui-baseline-override` re-runs the check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-lint-ratchet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  ui-tokens:
    name: UI token lint ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # pull_request checks out the merge commit; depth 2 brings its parents (HEAD^1 = base).
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: '1.3.14' }
      # eslint/stylelint need no install scripts; skipping them keeps this job hermetic.
      - run: bun install --frozen-lockfile --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Check the merge commit's base is available
        if: github.event_name == 'pull_request'
        run: |
          git rev-parse --verify --quiet 'HEAD^2^{commit}' >/dev/null || { echo "HEAD is not the PR merge commit"; exit 1; }
          git rev-parse --verify 'HEAD^1^{commit}'
      - name: Rule and ratchet unit tests
        run: bun test apps/electron/eslint-rules packages/ui/eslint-rules scripts/__tests__/lint-baseline.test.ts scripts/__tests__/stylelint-rules.test.ts
      - name: Ratchet (per-rule, per-file counts may only go down)
        if: github.event_name != 'pull_request'
        # The gate runs the owned script directly, not the (unowned) package.json alias.
        run: bun scripts/lint-baseline.ts --check
      - name: Ratchet vs the base commit's baseline (merge commit's first parent)
        if: github.event_name == 'pull_request'
        env:
          UI_BASELINE_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'ui-baseline-override') && '1' || '0' }}
        run: bun scripts/lint-baseline.ts --check --base 'HEAD^1'
