name: UI Lint Ratchet
# UI-A2 (#1568): rox/* ESLint token rules + stylelint, ratcheted per rule and per file against
# eslint-baselines/ui-tokens.json. Counts may only go down; a rule flips to error at 0.
# Runs on every PR: any UI file can add a raw z-index, colour or radius.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-tokens:
    name: UI token lint ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.3.14' }
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Rule and ratchet unit tests
        run: bun test apps/electron/eslint-rules packages/ui/eslint-rules scripts/__tests__/lint-baseline.test.ts
      - name: Ratchet (per-rule, per-file counts may only go down)
        run: bun run lint:ui-tokens
