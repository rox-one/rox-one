name: UI Route Recovery Fixtures

on:
  pull_request:
    paths:
      - 'apps/electron/src/shared/**'
      - 'apps/electron/src/main/deep-link.ts'
      - 'apps/electron/src/main/__tests__/deep-link-*.test.ts'
      - 'apps/electron/src/main/__tests__/rox-readiness-ui-001.native-preload.ts'
      - 'apps/electron/src/renderer/**'
      - '.github/workflows/ui-route-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'apps/electron/src/shared/**'
      - 'apps/electron/src/main/deep-link.ts'
      - 'apps/electron/src/main/__tests__/deep-link-*.test.ts'
      - 'apps/electron/src/main/__tests__/rox-readiness-ui-001.native-preload.ts'
      - 'apps/electron/src/renderer/**'
      - '.github/workflows/ui-route-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route-fixtures:
    # Browser/transport fixtures on hosted OS runners; not installed/native or
    # authenticated hosted-product acceptance for the UI-001 target matrix.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Route and shell regression
        run: >-
          bun test apps/electron/src/shared/__tests__
          apps/electron/src/renderer/contexts/__tests__
          apps/electron/src/renderer/components/app-shell/__tests__
          apps/electron/src/renderer/atoms/__tests__/panel-stack-knowledge.test.ts
          apps/electron/src/renderer/atoms/__tests__/panel-stack-lanes.test.ts
          apps/electron/src/renderer/atoms/__tests__/panel-stack-spatial-focus.test.ts
          apps/electron/src/renderer/atoms/rox-readiness-ui-001.geometry.test.ts
          apps/electron/src/renderer/atoms/rox-readiness-ui-001.layout.test.ts
          apps/electron/src/renderer/lib/__tests__/nav-helpers.test.ts
          apps/electron/src/renderer/platform/__tests__/layout-snapshot.test.ts
      - name: Typecheck Electron renderer and shared contracts
        run: bun run typecheck:electron
      - name: Install isolated Chromium
        run: bunx playwright install --with-deps chromium
      - name: Main-process protocol callbacks with synthetic windows and transport
        run: >-
          bun test --preload ./apps/electron/src/main/__tests__/rox-readiness-ui-001.native-preload.ts
          apps/electron/src/main/__tests__/deep-link-parse.test.ts
          apps/electron/src/main/__tests__/deep-link-routing.test.ts
      - name: Actual navigation callbacks in Chromium
        run: bun test apps/electron/src/renderer/components/app-shell/__tests__/rox-readiness-ui-001.navigation-browser.test.ts
        env:
          ROX_UI001_BROWSER_TEST: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui001-navigation-fixture-${{ matrix.os }}
          path: docs/final-readiness/execution/cloud/OWNER-UI-001/main-integration/browser/
          if-no-files-found: ignore
