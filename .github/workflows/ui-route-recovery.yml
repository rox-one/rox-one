name: UI Route Recovery Fixtures

on:
  pull_request:
    paths:
      - 'apps/electron/src/shared/**'
      - 'apps/electron/src/main/deep-link.ts'
      - 'apps/electron/src/main/__tests__/deep-link-*.test.ts'
      - 'apps/electron/src/main/__tests__/rox-readiness-ui-001.native-preload.ts'
      - 'apps/electron/src/renderer/**'
      - '.github/workflows/ui-route-recovery.yml'
  push:
    branches: [main]
    paths:
      - 'apps/electron/src/shared/**'
      - 'apps/electron/src/main/deep-link.ts'
      - 'apps/electron/src/main/__tests__/deep-link-*.test.ts'
      - 'apps/electron/src/main/__tests__/rox-readiness-ui-001.native-preload.ts'
      - 'apps/electron/src/renderer/**'
      - '.github/workflows/ui-route-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-route-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route-fixtures:
    # Browser/transport fixtures on hosted OS runners; not installed/native or
    # authenticated hosted-product acceptance for the UI-001 target matrix.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, blacksmith-6vcpu-macos-15]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Route and shell regression
        env:
          CHROMIUM_EXECUTABLE: ${{ runner.temp }}/ui001-separate-browser-phase
        run: >-
          bun test --timeout 30000 apps/electron/src/shared/__tests__
          apps/electron/src/renderer/contexts/__tests__
          apps/electron/src/renderer/components/app-shell/__tests__
          apps/electron/src/renderer/atoms/__tests__/panel-stack-knowledge.test.ts
          apps/electron/src/renderer/atoms/__tests__/panel-stack-lanes.test.ts
          apps/electron/src/renderer/atoms/__tests__/panel-stack-spatial-focus.test.ts
          apps/electron/src/renderer/atoms/rox-readiness-ui-001.geometry.test.ts
          apps/electron/src/renderer/atoms/rox-readiness-ui-001.layout.test.ts
          apps/electron/src/renderer/lib/__tests__/nav-helpers.test.ts
          apps/electron/src/renderer/lib/__tests__/rox-readiness-ui-001.panel-url.test.ts
          apps/electron/src/renderer/platform/__tests__/layout-snapshot.test.ts
      - name: Typecheck Electron renderer and shared contracts
        env:
          # The Electron renderer type graph is ~8.7k files / ~1.6M types and
          # peaks at ~4.3 GB of V8 old space, so both the runner default
          # (~2 GB) and the previous 4 GB budget aborted with SIGABRT (134).
          # 8 GB is roughly 2x the observed peak.
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run typecheck:electron
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        continue-on-error: true
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install isolated Chromium
        run: bunx playwright install --with-deps chromium
      - name: Quest card async lifetime regression
        run: |
          export CHROMIUM_EXECUTABLE="$(bun -e 'import {chromium} from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          bun test --timeout 30000 apps/electron/src/renderer/components/app-shell/__tests__/quest-progress-card.browser.test.ts
      - name: Main-process protocol callbacks with synthetic windows and transport
        run: >-
          bun test --preload ./apps/electron/src/main/__tests__/rox-readiness-ui-001.native-preload.ts
          apps/electron/src/main/__tests__/deep-link-parse.test.ts
          apps/electron/src/main/__tests__/deep-link-routing.test.ts
      - name: Actual navigation callbacks in Chromium
        run: |
          # This step switches the fixture suites on, so it also has to hand them the
          # browser that "Install isolated Chromium" put on the runner. Without the
          # export the suites enable themselves and then have no browser to launch —
          # the sibling workflow ui-001-recovery.yml exports the same variable.
          export ROX_UI001_CHROMIUM_EXECUTABLE="$(bun -e 'import {chromium} from "@playwright/test"; process.stdout.write(chromium.executablePath())')"
          bun test --timeout 60000 apps/electron/src/renderer/components/app-shell/__tests__/rox-readiness-ui-001.navigation-browser.test.ts \
            apps/electron/src/renderer/contexts/__tests__/rox-readiness-ui-001.navigation-browser.test.ts
        env:
          ROX_UI001_BROWSER_TEST: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui001-navigation-fixture-${{ matrix.os }}
          path: docs/final-readiness/execution/cloud/OWNER-UI-001/main-integration/browser/
          if-no-files-found: ignore
