name: Validate Server (Integration)

on:
  pull_request:
    paths:
      - packages/**
      - apps/webui/**
      - apps/electron/src/renderer/**
      - apps/electron/resources/**
      - scripts/test-*.ts
      - package.json
      - bun.lock
      - bunfig.toml
      - .github/workflows/validate-server.yml
  push:
    paths:
      - packages/**
      - apps/webui/**
      - apps/electron/src/renderer/**
      - apps/electron/resources/**
      - scripts/test-*.ts
      - package.json
      - bun.lock
      - bunfig.toml
      - .github/workflows/validate-server.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-server-${{ github.ref }}

jobs:
  lifecycle:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      matrix:
        scenario: [lifecycle]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4

        continue-on-error: true
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build agent subprocess
        run: bun run server:build:subprocess

      - name: Build WebUI assets
        run: bun run webui:build
        env:
          # The hosted macOS Vite build exceeded Node's default ~2 GiB heap.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build server bundle
        # xlsx stays external — its ESM build has no default export, so bundling fails;
        # markitdown-js requires() it at runtime from node_modules instead.
        run: bun build packages/server/src/index.ts --target bun --outdir dist-server --external xlsx

      - name: Start server and run lifecycle smoke
        run: bun test packages/server/src/__tests__/smoke.test.ts
        env:
          ROX_SERVER_SMOKE_ENTRY: dist-server/index.js
          ROX_SERVER_SMOKE_WEBUI_DIR: apps/webui/dist
