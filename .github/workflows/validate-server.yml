name: Validate Server (Integration)

on:
  pull_request:
    paths:
      - packages/**
      - apps/webui/**
      - apps/electron/src/renderer/**
      - apps/electron/resources/**
      - scripts/test-*.ts
      - package.json
      - bun.lock
      - bunfig.toml
      - .github/workflows/validate-server.yml
  push:
    paths:
      - packages/**
      - apps/webui/**
      - apps/electron/src/renderer/**
      - apps/electron/resources/**
      - scripts/test-*.ts
      - package.json
      - bun.lock
      - bunfig.toml
      - .github/workflows/validate-server.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-server-${{ github.ref }}

jobs:
  lifecycle:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      matrix:
        scenario: [lifecycle]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Build agent subprocess
        run: bun run server:build:subprocess

      - name: Build WebUI assets
        run: bun run webui:build
        env:
          # The hosted macOS Vite build exceeded Node's default ~2 GiB heap.
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Build server bundle
        # xlsx stays external — its ESM build has no default export, so bundling fails;
        # markitdown-js requires() it at runtime from node_modules instead.
        run: bun build packages/server/src/index.ts --target bun --outdir dist-server --external xlsx

      - name: Start server and run lifecycle smoke
        run: bun test packages/server/src/__tests__/smoke.test.ts
        env:
          ROX_SERVER_SMOKE_ENTRY: dist-server/index.js
          ROX_SERVER_SMOKE_WEBUI_DIR: apps/webui/dist
