openapi: 3.1.0
info:
  title: Rox Cloud API
  version: 0.1.0
  summary: One public contract in front of customer-owned sandbox providers (BYOK).
  description: |
    Rox Cloud runs in "bring your own key" mode: the customer's own credential
    for Daytona, Modal or E2B is what actually boots a machine. This API never
    appears as the payer and never invents a provider capability.

    The tenant always comes from the presented API key, never from the request
    body. Money is reported as integer cents plus a two-decimal dollar string.
    Time is ISO 8601 in UTC. Every response carries `x-request-id`, and every
    failure repeats it inside the error envelope.
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8787
    description: Local pilot
security:
  - bearerAuth: []
tags:
  - name: health
  - name: demo
  - name: catalog
  - name: guest
  - name: providers
  - name: keys
  - name: account
  - name: sandboxes
  - name: usage
  - name: audit
  - name: admin
  - name: tickets
  - name: status

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [health]
      security: []
      responses:
        '200':
          description: The API process is up.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    const: true

  /v1/demo:
    post:
      operationId: runDemo
      summary: Run one command on the shared demo machine; no key is needed
      tags: [demo]
      security: []
      description: |
        The public playground behind `/playground.html`. There is no key and no
        tenant in the request: the machine boots under one fixed demo tenant
        whose provider credential never leaves the vault. The limits are the
        contract: one run per address per UTC day, a 60-second machine, a
        10-second command timeout, a command of at most 2 KB inside a body of at
        most 8 KB. The answer carries stdout, the exit code, the price in cents
        and the sandbox id minted by Rox; a provider id, a provider-side sandbox
        id and any key are never returned. When the demo tenant has no usable
        provider credential the route answers `503 demo_unavailable` and creates
        nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoRequest'
      responses:
        '200':
          description: The command finished and the machine was destroyed afterwards.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/catalog:
    get:
      operationId: getCatalog
      summary: Machine products with both prices, providers and managed availability
      tags: [catalog]
      description: |
        Any valid key may read the catalog. Each product carries the full retail
        price per hour (`cents_per_hour`) and the service fee a customer pays
        when they bring their own provider key (`service_fee_cents_per_hour`).
        `managed_providers` lists the providers Rox can pay for itself right now,
        so the site never offers a mode that would answer `capability_unavailable`.
      responses:
        '200':
          description: Eight priced products plus one entry per configured provider.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Catalog'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/guest:
    post:
      operationId: createGuest
      summary: Trial tenant, one key and a trial balance; no registration
      tags: [guest]
      security: []
      description: |
        Public, no key. Enabled only with `ROX_GUEST_ENABLED=1`; otherwise
        `403 guest_disabled`. At most five sign-ups an hour from one client
        address, counted by the server's own `requestIP` (or the forwarded
        header), never by a key. The tenant is `guest-…` with one machine, 16
        cores, the trial balance as a monthly cap and a machine lifetime of at
        most 24 hours. The key gets `sandboxes:read`, `sandboxes:write` and
        `billing:read` only: it cannot mint keys or add balance. The secret is
        returned as `api_key` and never again.
      responses:
        '201':
          description: The guest tenant, its one key and the trial balance.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestCreated'
        '403':
          description: Guest sign-up is off in this deployment (`guest_disabled`).
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/providers/{id}/images:
    get:
      operationId: listProviderImages
      summary: Images this customer can boot at a provider
      tags: [providers]
      description: |
        Requires the `sandboxes:read` scope. The customer's own credential is
        used when it exists, the platform key otherwise; the answer says which
        (`mode`). For Daytona the adapter reads `GET /snapshots` and keeps only
        active snapshots, returning their exact cpu / memory / disk / GPU. A
        provider without a list route answers `400 capability_unavailable`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            enum: [daytona, modal, e2b]
      responses:
        '200':
          description: The active images, in provider order.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderImageList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/BadGateway'

  /v1/keys:
    post:
      operationId: createApiKey
      summary: Mint an API key; the secret is returned exactly once
      tags: [keys]
      description: Requires the `keys:write` scope. A key can only be granted scopes its creator already holds.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scopes]
              properties:
                scopes:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/Scope'
      responses:
        '201':
          description: The key was created. Store `api_key` now; it is not retrievable later.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: listApiKeys
      summary: List key metadata for the current tenant
      tags: [keys]
      description: Requires the `keys:write` scope. Secrets are never returned.
      responses:
        '200':
          description: Key metadata only.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/keys/{id}:
    delete:
      operationId: deleteApiKey
      summary: Revoke a key
      tags: [keys]
      description: Requires the `keys:write` scope. The key stops authenticating immediately.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: The key is gone.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/account:
    get:
      operationId: getAccount
      summary: Balance and month limits for the current tenant
      tags: [account]
      description: |
        Any valid key may read its own tenant's account. A tenant without a
        wallet reads as zero rather than as an error. Money is integer cents
        plus a two-decimal dollar string; `rate_cents_per_hour` is null when the
        deployment has no platform fee configured. There is no customer top-up
        route: credit is added by staff under
        `POST /v1/admin/tenants/{id}/credit`.
      responses:
        '200':
          description: The account.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/provider-credentials:
    get:
      operationId: listProviderCredentials
      summary: List the tenant's provider keys, metadata only
      tags: [keys]
      description: |
        Requires the `keys:write` scope. The plaintext secret, ciphertext, iv and
        tag never leave the vault, so none of them can appear here.
      responses:
        '200':
          description: One entry per stored key of this tenant.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProviderCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createProviderCredential
      summary: Add a customer-owned provider key, encrypted at rest
      tags: [keys]
      description: |
        Requires the `keys:write` scope. The secret is encrypted with AES-256-GCM
        immediately and is never stored or returned as plaintext. The first key
        for a provider becomes `active`; later ones join as `standby`.
        `spendCapCents` is required on purpose: a cap that defaults to zero reads
        as "spend nothing" to the vault gate, so the caller must state it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCredentialCreateRequest'
      responses:
        '201':
          description: The stored key, metadata only.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: This exact key was already added for the tenant.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/provider-credentials/{id}:
    delete:
      operationId: disableProviderCredential
      summary: Disable a provider key
      tags: [keys]
      description: |
        Requires the `keys:write` scope. The key is disabled, not erased: it stays
        visible with status `disabled` so the panel can show what was rotated
        away instead of a silent disappearance.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: The key after it was turned off.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/provider-credentials/{id}/promote:
    post:
      operationId: promoteProviderCredential
      summary: Make this key the active one for its provider
      tags: [keys]
      description: |
        Requires the `keys:write` scope. The tenant's other `active` key for the
        same provider becomes `standby`, so exactly one key per provider
        authorizes a spend.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: The promoted key.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderCredential'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/sandboxes:
    post:
      operationId: createSandbox
      summary: Boot a sandbox on the tenant's own provider credential
      tags: [sandboxes]
      description: |
        Requires the `sandboxes:write` scope and the `Idempotency-Key` header.
        Repeating the same key with the same body returns the same sandbox with
        `200`; repeating it with another body is `409`. Records live 24 hours.

        The machine is bought by product (`product`) or by snapshot
        (`snapshot`); the server resolves the image and takes its cpu, memory,
        disk and GPU from the catalog or from the provider's live image list.
        `cpu`, `memoryGb`, `diskGb` and `gpu` in the body are only a cross-check:
        a disagreement is `400 invalid_request`, and `snapshot: daytona-gpu`
        always costs the GPU price even if one core is asked for. Without a
        product or a snapshot, `os`, `cpu` and `memoryGb` are required.

        The provider comes from the customer's own credential (`byok`) or from
        Rox's platform key (`managed`); the price of the hour and the mode are
        stored on the machine and reported in `billing`. An unknown provider id
        is `400 provider_unknown`; no credential and no platform key is
        `400 capability_unavailable`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
          description: Caller-chosen key, unique per tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SandboxCreateRequest'
      responses:
        '201':
          description: A new sandbox was booted.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '200':
          description: The same idempotency key and body were seen before; this is the original sandbox.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
    get:
      operationId: listSandboxes
      summary: List the tenant's sandboxes
      tags: [sandboxes]
      description: Requires the `sandboxes:read` scope.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: starting_after
          in: query
          schema:
            type: string
          description: Id of the last sandbox already seen.
      responses:
        '200':
          description: One page of sandboxes.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [object, data, has_more, next_cursor]
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sandbox'
                  has_more:
                    type: boolean
                  next_cursor:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/sandboxes/{id}:
    get:
      operationId: getSandbox
      summary: Read one sandbox
      tags: [sandboxes]
      description: Requires the `sandboxes:read` scope. Another tenant's id answers 404.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: The sandbox.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteSandbox
      summary: Destroy a sandbox for good
      tags: [sandboxes]
      description: Requires the `sandboxes:write` scope. The provider machine is deleted, then the record is forgotten.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: The sandbox is gone.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'

  /v1/sandboxes/{id}/exec:
    post:
      operationId: execInSandbox
      summary: Run a command inside a sandbox
      tags: [sandboxes]
      description: Requires the `sandboxes:write` scope.
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  minLength: 1
                cwd:
                  type: string
                  description: Working directory inside the machine, e.g. `/root`.
                timeout_sec:
                  type: number
                  exclusiveMinimum: 0
                  description: How long the command may run, in seconds.
      responses:
        '200':
          description: The command finished.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'

  /v1/sandboxes/{id}/files:
    get:
      operationId: readSandboxFile
      summary: Download a file as raw bytes
      tags: [sandboxes]
      description: Requires the `sandboxes:read` scope.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Absolute path inside the sandbox.
      responses:
        '200':
          description: File contents.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/octet-stream:
              schema:
                type: string
                contentEncoding: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
    put:
      operationId: writeSandboxFile
      summary: Upload a file as raw bytes
      tags: [sandboxes]
      description: Requires the `sandboxes:write` scope.
      parameters:
        - $ref: '#/components/parameters/PathId'
        - name: path
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              contentEncoding: binary
      responses:
        '204':
          description: The file was written.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'

  /v1/sandboxes/{id}/stop:
    post:
      operationId: stopSandbox
      summary: Stop a sandbox without deleting it
      tags: [sandboxes]
      description: Requires the `sandboxes:write` scope.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: The sandbox is stopped.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sandbox'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'

  /v1/usage:
    get:
      operationId: listUsage
      summary: Invoice lines for the tenant's machines
      tags: [usage]
      description: |
        Requires the `billing:read` scope. One row per machine, written when it
        boots and closed with the final amount and stop time when it stops.
        Deleting a machine keeps its row. `format=csv` answers the same rows as
        `text/csv` for the console's «Скачать CSV».
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, csv]
            default: json
      responses:
        '200':
          description: One row per machine, in integer cents.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UsageRow'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/audit:
    get:
      operationId: listTenantAudit
      summary: The tenant's own journal of actions
      tags: [audit]
      description: |
        Any valid key may read the journal of its own tenant. Only entries
        written in the tenant's name, against the tenant or against one of its
        machines are returned: staff actions and other tenants never appear.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: action
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Newest first.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantAuditEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/status:
    get:
      operationId: getPublicStatus
      summary: Public status page — the incidents that are happening now
      tags: [status]
      security: []
      description: |
        No key is needed. The page is deliberately narrow: the title, the public
        summary, the severity, the status and the last update of each live
        incident — never an id, a scope, a timeline or any tenant data. A
        resolved incident leaves the page, so it answers with an empty list when
        nothing is wrong.
      responses:
        '200':
          description: One entry per live incident, newest first.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusPage'

  /v1/tickets:
    get:
      operationId: listTickets
      summary: The tenant's own tickets, newest first
      tags: [tickets]
      description: Any valid key may read the tickets of the tenant it belongs to; no extra scope is needed.
      responses:
        '200':
          description: Every ticket of this tenant, thread included.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTicket
      summary: Open a support ticket
      tags: [tickets]
      description: |
        The first message is authored by the tenant and the ticket starts in
        `open`, waiting on staff. A message that carries a provider key is
        refused whole with `secret_in_ticket`: no part of it is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketCreate'
      responses:
        '201':
          description: The ticket was opened.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/tickets/{id}:
    get:
      operationId: getTicket
      summary: One ticket of the tenant, thread included
      tags: [tickets]
      description: A ticket of another tenant answers 404, exactly like an unknown id.
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: The ticket and its messages.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/tickets/{id}/reply:
    post:
      operationId: replyToTicket
      summary: Add a customer message to the thread
      tags: [tickets]
      description: |
        The ticket goes back to `open`: a customer writing always puts the ball
        with staff. A resolved ticket refuses a reply with 409 — open a new one.
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketReply'
      responses:
        '200':
          description: The ticket with the new message appended.
          headers:
            x-request-id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

