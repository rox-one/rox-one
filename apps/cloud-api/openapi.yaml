components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Send `Authorization: Bearer rox_sk_live_…`. The key's scopes decide what
        the request may do: `sandboxes:read`, `sandboxes:write`, `keys:write`,
        `billing:read`, `billing:write`. A missing, unknown or revoked key is
        `401 authentication_required`; a missing scope is `403 permission_denied`.
        A guest key holds the first three listed here minus `keys:write`, plus
        `billing:read`: it cannot mint keys or add balance.
    staffKey:
      type: http
      scheme: bearer
      description: |
        The staff key from `ROX_ADMIN_KEY`, the same value for the panel JSON
        API and the support staff routes. A wrong key and no key answer the same
        401; a deployment without the variable answers 404 on every route.

  headers:
    RequestId:
      description: Request id, the same value the error envelope repeats.
      schema:
        type: string
        pattern: '^req_[0-9a-f]{24}$'

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    Scope:
      type: string
      enum: [sandboxes:read, sandboxes:write, keys:write, billing:read, billing:write]

    Error:
      type: object
      required: [type, code, message, request_id]
      properties:
        type:
          type: string
          description: Error family, e.g. `authentication_error`.
        code:
          type: string
          enum:
            - invalid_request
            - secret_in_ticket
            - secret_in_record
            - idempotency_key_required
            - provider_unknown
            - capability_unavailable
            - sandbox_too_large
            - authentication_required
            - entitlement_required
            - insufficient_balance
            - budget_exceeded
            - payment_required
            - permission_denied
            - guest_disabled
            - not_found
            - conflict
            - kill_switch_active
            - concurrency_exceeded
            - monthly_cap_exceeded
            - rate_limited
            - demo_limit
            - payload_too_large
            - demo_unavailable
            - provider_error
        message:
          type: string
          description: Human-readable explanation, in Russian.
        request_id:
          type: string
          pattern: '^req_[0-9a-f]{24}$'

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

    DemoRequest:
      type: object
      required: [command]
      properties:
        command:
          type: string
          minLength: 1
          maxLength: 2048
          description: |
            What to run on the demo machine. Empty, blank or longer than 2 KB is
            `400 invalid_request`; the whole body may be at most 8 KB.

    DemoResult:
      type: object
      description: |
        One finished run. The machine is destroyed before this answer is sent,
        and no provider id or key is part of it.
      required: [stdout, stderr, exit_code, cost_cents, sandbox_id]
      properties:
        stdout:
          type: string
        stderr:
          type: string
        exit_code:
          type: integer
        cost_cents:
          type: integer
          minimum: 1
          description: Price of the run at the platform rate; at least one cent.
        sandbox_id:
          type: string
          description: Id minted by Rox for this one run, e.g. `sbx_…`.

    Catalog:
      type: object
      required: [object, products, providers, managed_providers]
      properties:
        object:
          const: catalog
        products:
          type: array
          description: The eight machines of the price list, in canonical order.
          items:
            $ref: '#/components/schemas/MachineProduct'
        providers:
          type: array
          items:
            $ref: '#/components/schemas/ProviderCapabilities'
        managed_providers:
          type: array
          description: Providers Rox can pay for itself right now, e.g. `["daytona"]`.
          items:
            type: string

    MachineProduct:
      type: object
      required:
        - id
        - name
        - snapshot
        - os
        - cpu
        - memory_gb
        - disk_gb
        - gpu
        - cents_per_hour
        - service_fee_cents_per_hour
        - available
        - note
      properties:
        id:
          type: string
          enum:
            - linux-start
            - linux-pro
            - linux-large
            - windows-start
            - windows-pro
            - windows-large
            - windows-xl
            - gpu-h100
        name:
          type: string
          description: The word a customer sees, e.g. «Разработка».
        snapshot:
          type: string
          description: |
            Daytona snapshot that carries exactly these resources. The Linux
            rows use `daytonaio/sandbox:0.11.0`, `rox-cloud-medium-2x4` and
            `rox-cloud-large-4x8`; the earlier custom snapshots fail exec and
            are not sold.
        os:
          type: string
          enum: [linux, windows]
        cpu:
          type: integer
        memory_gb:
          type: integer
        disk_gb:
          type: integer
        gpu:
          type: [object, 'null']
          required: [type, count]
          properties:
            type:
              type: string
            count:
              type: integer
        cents_per_hour:
          type: integer
          description: Full retail price per hour when Rox pays the provider (managed).
        service_fee_cents_per_hour:
          type: integer
          description: What the wallet pays when the customer brings their own key (byok).
        available:
          type: boolean
          description: |
            Whether this account can boot the product now. `false` means the
            vendor blocks the class (no Windows class, no GPU credits): the
            product is still listed with its price and `note`, but creating by
            `product` answers `400 capability_unavailable` before any hold.
        note:
          type: [string, 'null']
          description: Why an unavailable product cannot launch, e.g. «Нужны GPU-кредиты Daytona».

    GuestCreated:
      type: object
      required: [object, tenant, api_key, balance_cents]
      properties:
        object:
          const: guest
        tenant:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
              description: Starts with `guest-`.
            name:
              const: Гость
        api_key:
          type: string
          description: The full key, returned once. Scope-limited to sandboxes and billing read.
        balance_cents:
          type: integer
          description: The trial balance in cents, e.g. 2000.

    ProviderImageList:
      type: object
      required: [object, provider, mode, data]
      properties:
        object:
          const: list
        provider:
          type: string
        mode:
          type: string
          enum: [byok, managed]
          description: Which credential answered the list.
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProviderImage'

    ProviderImage:
      type: object
      required: [id, name, os, cpu, memoryGb, diskGb, gpu, state]
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
          description: Readable picker label, e.g. «Linux · 2 CPU · 4 ГБ».
        os:
          type: string
          enum: [linux, windows, macos]
        cpu:
          type: integer
        memoryGb:
          type: integer
        diskGb:
          type: integer
        gpu:
          type: [object, 'null']
          required: [type, count]
          properties:
            type:
              type: string
            count:
              type: integer
        state:
          type: string
          description: Provider state; only active images are listed.

    TenantAuditEntry:
      type: object
      required: [id, tenant_id, actor, action, target_type, target_id, reason, at, details, request_id]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        actor:
          type: string
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        reason:
          type: string
        at:
          type: string
          format: date-time
        details:
          type: [object, 'null']
        request_id:
          type: [string, 'null']

    AdminOverview:
      type: object
      required:
        - tenants
        - guests
        - active_sandboxes
        - credentials
        - balance_cents_total
        - open_kill_switches
        - platform_keys
      properties:
        tenants:
          type: integer
        guests:
          type: integer
        active_sandboxes:
          type: integer
        credentials:
          type: integer
        balance_cents_total:
          type: integer
        open_kill_switches:
          type: integer
        platform_keys:
          type: array
          items:
            type: object
            required: [provider, present, last4]
            properties:
              provider:
                type: string
              present:
                type: boolean
              last4:
                type: [string, 'null']

    AdminTenant:
      type: object
      required:
        - id
        - name
        - created_at
        - guest
        - balance_cents
        - reserved_cents
        - month_spent_cents
        - sandboxes
        - credentials
        - keys
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        guest:
          type: boolean
        balance_cents:
          type: integer
        reserved_cents:
          type: integer
        month_spent_cents:
          type: integer
        sandboxes:
          type: integer
        credentials:
          type: integer
        keys:
          type: integer

    AdminAccount:
      type: object
      required: [paid, balance_cents, reserved_cents, monthly_cap_cents, month_spent_cents]
      properties:
        paid:
          type: boolean
        balance_cents:
          type: integer
        reserved_cents:
          type: integer
        monthly_cap_cents:
          type: integer
        month_spent_cents:
          type: integer

    AdminLimits:
      type: object
      required: [max_concurrent_sandboxes, max_cpu_per_sandbox, max_monthly_cents]
      properties:
        max_concurrent_sandboxes:
          type: integer
          description: 0 means «не ограничено».
        max_cpu_per_sandbox:
          type: integer
        max_monthly_cents:
          type: integer

    AdminResource:
      type: object
      required: [id, tenant_id, provider, state, created_at, expires_at, cost_cents]
      properties:
        id:
          type: string
        tenant_id:
          type: string
        provider:
          type: string
        state:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, 'null']
        cost_cents:
          type: integer
        region:
          type: [string, 'null']
        billing_mode:
          type: string
          enum: [byok, managed]
        rate_cents_per_hour:
          type: [integer, 'null']
        spec:
          type: object
          description: The stored request, the same shape the customer API reports.
          required: [os, cpu, memoryGb, diskGb, gpu, image, snapshot, region, ttlSec]
          properties:
            os:
              type: string
            cpu:
              type: number
            memoryGb:
              type: number
            diskGb:
              type: [number, 'null']
            gpu:
              type: [object, 'null']
            image:
              type: [string, 'null']
            snapshot:
              type: [string, 'null']
            region:
              type: [string, 'null']
            ttlSec:
              type: [integer, 'null']

    AdminApiKey:
      type: object
      required:
        - id
        - tenant_id
        - tenant_name
        - prefix
        - last4
        - scopes
        - created_at
        - revoked_at
        - balance_cents
        - reserved_cents
      properties:
        id:
          type: string
        tenant_id:
          type: string
        tenant_name:
          type: [string, 'null']
        guest:
          type: boolean
        prefix:
          type: string
        last4:
          type: string
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, 'null']
        revoked_at:
          type: [string, 'null']
        balance_cents:
          type: integer
        reserved_cents:
          type: integer

    AdminAuditEntry:
      type: object
      required: [id, at, actor_id, action, target_type, target_id, reason]
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        actor_id:
          type: string
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        reason:
          type: string
        ticket:
          type: [string, 'null']
        details:
          type: [object, 'null']

    RequestRow:
      type: object
      required: [at, method, path, status, duration_ms, tenant_id, key_last4, ip, request_id]
      properties:
        at:
          type: string
          format: date-time
        method:
          type: string
        path:
          type: string
          description: Path only; the query string is not kept.
        status:
          type: integer
        duration_ms:
          type: integer
        tenant_id:
          type: [string, 'null']
        key_last4:
          type: [string, 'null']
        ip:
          type: [string, 'null']
        request_id:
          type: [string, 'null']

    ProviderCapabilities:
      type: object
      description: Exactly what the caller declared for this provider; nothing is inferred.
      required: [id, os, gpu, pause, snapshot, volume, streaming, max_ttl_sec, regions]
      properties:
        id:
          type: string
        os:
          type: array
          items:
            type: string
            enum: [linux, windows, macos]
        gpu:
          type: boolean
        pause:
          type: boolean
        snapshot:
          type: boolean
        volume:
          type: boolean
        streaming:
          type: string
          enum: [sse, websocket, none]
          description: How the vendor streams command output.
        max_ttl_sec:
          type: integer
          minimum: 0
          description: Ceiling for `ttlSec`; 0 means no documented ceiling.
        regions:
          type: array
          items:
            type: string

    Account:
      type: object
      required:
        - object
        - balance_cents
        - reserved_cents
        - month_spent_cents
        - monthly_cap_cents
        - rate_cents_per_hour
        - currency
        - balance_usd
      properties:
        object:
          const: account
        balance_cents:
          type: integer
          description: Available credit, integer cents.
        reserved_cents:
          type: integer
          minimum: 0
          description: Held for running sandboxes and not yet spent.
        month_spent_cents:
          type: integer
          minimum: 0
        monthly_cap_cents:
          type: integer
          minimum: 0
          description: Ceiling for the month; 0 means no cap set.
        rate_cents_per_hour:
          type: [integer, 'null']
          description: Platform fee in cents per sandbox-hour; null when not configured.
        currency:
          const: USD
        balance_usd:
          type: string
          pattern: '^\d+\.\d{2}$'


    CredentialStatus:
      type: string
      enum: [active, standby, disabled, expired]
      description: |
        `active` authorizes spends, `standby` is a spare, `disabled` was turned
        off by the tenant, `expired` is past its `expires_at`.

    CredentialHealth:
      type: string
      enum: [ok, degraded, invalid, unknown]
      description: Result of the last provider probe; `unknown` until one runs.

    ProviderCredential:
      type: object
      description: |
        Metadata only. The plaintext secret and the stored `ciphertext`, `iv` and
        `tag` are never part of any response.
      required:
        - id
        - object
        - provider
        - label
        - fingerprint
        - last4
        - status
        - spend_cap_cents
        - regions
        - products
        - health
        - created_at
        - checked_at
        - expires_at
      properties:
        id:
          type: string
        object:
          const: provider_credential
        provider:
          type: string
          enum: [daytona, modal, e2b]
        label:
          type: string
          description: Tenant-supplied name; defaults to the provider id.
        fingerprint:
          type: string
          description: sha256 hex of the secret, used to reject duplicate keys.
        last4:
          type: string
          minLength: 4
          maxLength: 4
          description: The only secret-derived text a response ever contains.
        status:
          $ref: '#/components/schemas/CredentialStatus'
        spend_cap_cents:
          type: integer
          minimum: 0
          description: Per-key ceiling in cents for a single authorized spend.
        regions:
          type: array
          items:
            type: string
        products:
          type: array
          items:
            type: string
        health:
          $ref: '#/components/schemas/CredentialHealth'
        created_at:
          type: string
          format: date-time
        checked_at:
          type: [string, 'null']
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time

    ProviderCredentialCreateRequest:
      type: object
      required: [provider, secret, spendCapCents]
      properties:
        provider:
          type: string
          enum: [daytona, modal, e2b]
        label:
          type: string
        secret:
          type: string
          minLength: 1
          writeOnly: true
          description: The customer's own provider key; encrypted immediately, never stored or echoed.
        spendCapCents:
          type: integer
          minimum: 0
          description: Required, because a cap of zero means "spend nothing".
        regions:
          type: array
          items:
            type: string
        products:
          type: array
          items:
            type: string

    SandboxCreateRequest:
      type: object
      properties:
        product:
          type: string
          description: |
            Product code from the catalog. Its snapshot and resources are what
            the machine gets, and what it is priced by. Mutually exclusive with
            `snapshot`, because a product already names one.
        os:
          type: string
          enum: [linux, windows, macos]
          description: Required without `product` and `snapshot`; a cross-check with them.
        cpu:
          type: number
          exclusiveMinimum: 0
          description: Required without `product` and `snapshot`; a cross-check with them.
        memoryGb:
          type: number
          exclusiveMinimum: 0
          description: Required without `product` and `snapshot`; a cross-check with them.
        diskGb:
          type: number
          exclusiveMinimum: 0
        gpu:
          type: object
          required: [type, count]
          properties:
            type:
              type: string
            count:
              type: integer
              minimum: 1
            spot:
              type: boolean
        image:
          type: string
        snapshot:
          type: string
          description: |
            Provider snapshot to boot; looked up in the live image list and its
            resources are what is priced. Mutually exclusive with `image` and
            `product`.
        region:
          type: string
          description: Provider region, e.g. `us` or `us-west-4`; omitted means the provider chooses.
        ttlSec:
          type: integer
          minimum: 1
        metadata:
          type: object
          additionalProperties:
            type: string
        provider:
          type: string
          description: Provider id; defaults to the API's configured default.

    Sandbox:
      type: object
      required:
        - id
        - object
        - provider
        - state
        - created_at
        - expires_at
        - cost_so_far_cents
        - cost_so_far_usd
        - routing_reason
        - spec
        - region
        - billing
      properties:
        id:
          type: string
          pattern: '^sbx_[0-9a-f]{24}$'
        object:
          const: sandbox
        provider:
          type: string
          description: Provider id that actually served the request.
        state:
          type: string
          enum: [queued, starting, running, paused, stopped, stopping, failed, expired]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        cost_so_far_cents:
          type: integer
          minimum: 0
        cost_so_far_usd:
          type: string
          pattern: '^\d+\.\d{2}$'
        routing_reason:
          type: [string, 'null']
          description: Why this provider and credential were used.
        spec:
          type: object
          required: [os, cpu, memoryGb, diskGb, image, snapshot, gpu, region, ttlSec]
          properties:
            os:
              type: string
              enum: [linux, windows, macos]
            cpu:
              type: number
            memoryGb:
              type: number
            diskGb:
              type: [number, 'null']
            image:
              type: [string, 'null']
            snapshot:
              type: [string, 'null']
            gpu:
              type: [object, 'null']
            region:
              type: [string, 'null']
            ttlSec:
              type: [integer, 'null']
        region:
          type: [string, 'null']
          description: Region the machine was asked for; null means the provider chose.
        billing:
          $ref: '#/components/schemas/SandboxBilling'

    SandboxBilling:
      type: object
      required:
        - mode
        - rate_cents_per_hour
        - retail_cents_per_hour
        - service_fee_cents_per_hour
      properties:
        mode:
          type: string
          enum: [byok, managed]
          description: |
            `managed` — Rox pays the provider and the wallet pays retail;
            `byok` — the customer pays the provider and the wallet pays the fee.
        rate_cents_per_hour:
          type: [integer, 'null']
          description: The rate this machine is metered and settled at.
        retail_cents_per_hour:
          type: [integer, 'null']
          description: Full price of the shape; null when the deployment has no price list.
        service_fee_cents_per_hour:
          type: [integer, 'null']
          description: Rox's fee for the same shape on the customer's own key.

    ExecResult:
      type: object
      required: [stdout, stderr, exit_code]
      properties:
        stdout:
          type: string
        stderr:
          type: string
        exit_code:
          type: integer

    ApiKey:
      type: object
      required: [id, prefix, last4, scopes, created_at, last_used_at]
      properties:
        id:
          type: string
        prefix:
          type: string
          description: Always `rox_sk_live_`; safe to show.
        last4:
          type: string
          minLength: 4
          maxLength: 4
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
          description: Set when a rotation replaced the key; a revoked key answers 401.

    ApiKeyCreated:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [api_key]
          properties:
            api_key:
              type: string
              description: The full key. Returned once and never stored in plaintext.

    InvoiceLine:
      type: object
      required:
        - id
        - ref
        - product
        - label
        - snapshot
        - billing_mode
        - rate_cents_per_hour
        - retail_cents_per_hour
        - service_fee_cents_per_hour
        - cents
        - currency
        - created_at
        - started_at
        - stopped_at
      properties:
        id:
          type: string
        ref:
          type: string
          description: The sandbox the line belongs to; kept after the machine is deleted.
        product:
          const: sandbox
        label:
          type: string
          description: What a person reads, e.g. «Разработка» or a snapshot name.
        snapshot:
          type: [string, 'null']
        billing_mode:
          type: string
          enum: [byok, managed]
        rate_cents_per_hour:
          type: [integer, 'null']
        retail_cents_per_hour:
          type: [integer, 'null']
        service_fee_cents_per_hour:
          type: [integer, 'null']
        cents:
          type: integer
          minimum: 0
          description: Rising with the meter while the machine runs, final after the stop.
        currency:
          const: USD
        created_at:
          type: string
          format: date-time
        started_at:
          type: [string, 'null']
        stopped_at:
          type: [string, 'null']

    UsageRow:
      allOf:
        - $ref: '#/components/schemas/InvoiceLine'

    TicketStatus:
      type: string
      enum: [open, pending, resolved]
      description: |
        Where the ticket waits: `open` on staff, `pending` on the customer,
        `resolved` nowhere — a resolved ticket is terminal.

    TicketPriority:
      type: string
      enum: [low, normal, high]

    TicketMessage:
      type: object
      required: [id, object, author_role, body, created_at]
      properties:
        id:
          type: string
          pattern: '^msg_'
        object:
          const: ticket_message
        author_role:
          type: string
          enum: [customer, staff]
        body:
          type: string
          description: |
            Plain text as it was written, or a structured body stored as JSON
            text. A message carrying a provider key is never stored.
        created_at:
          type: string
          format: date-time

    Ticket:
      type: object
      required: [id, object, subject, status, priority, created_at, updated_at, messages]
      properties:
        id:
          type: string
          pattern: '^tkt_'
        object:
          const: ticket
        subject:
          type: string
          minLength: 3
          maxLength: 120
        status:
          $ref: '#/components/schemas/TicketStatus'
        priority:
          $ref: '#/components/schemas/TicketPriority'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: '#/components/schemas/TicketMessage'

    TicketList:
      type: object
      required: [object, data]
      properties:
        object:
          const: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'

    TicketCreate:
      type: object
      required: [subject, body]
      properties:
        subject:
          type: string
          minLength: 3
          maxLength: 120
          description: Short statement of the problem, trimmed before it is stored.
        body:
          description: |
            First message of the thread: plain text, or an object which is
            stored as JSON text. A field named `secret`, `token`, `password` or
            `key`, or a key-like string, rejects the whole request.
          oneOf:
            - type: string
              minLength: 1
            - type: object
              additionalProperties: true
        priority:
          $ref: '#/components/schemas/TicketPriority'

    TicketReply:
      type: object
      required: [body]
      properties:
        body:
          description: The message to append; the same rules as the opening message.
          oneOf:
            - type: string
              minLength: 1
            - type: object
              additionalProperties: true

    PublicIncident:
      type: object
      required: [title, public_summary, severity, status, updated_at]
      properties:
        title:
          type: string
        public_summary:
          type: string
        severity:
          type: string
          enum: [minor, major, critical]
        status:
          type: string
          enum: [investigating, identified, monitoring, resolved]
        updated_at:
          type: string
          format: date-time

    StatusPage:
      type: object
      required: [incidents]
      properties:
        incidents:
          type: array
          description: Live incidents only, newest first.
          items:
            $ref: '#/components/schemas/PublicIncident'

  responses:
    BadRequest:
      description: The request body or parameters are wrong.
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: No key, or an unknown key.
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: The key lacks the required scope.
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: No such object for this tenant.
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PaymentRequired:
      description: |
        The wallet refuses the spend: `entitlement_required`,
        `insufficient_balance` or `budget_exceeded`.
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: |
        The idempotency key was already used with another body, or an account
        limit refuses the boot: `kill_switch_active`, `concurrency_exceeded` or
        `monthly_cap_exceeded`.
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Too many requests for this key in the current window.
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    MethodNotAllowed:
      description: The route exists but does not take this method.
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: The body is larger than the route accepts; the demo takes 8 KB at most.
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: |
        The demo is not configured: the demo tenant has no usable provider
        credential, so nothing was created and nothing was charged.
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadGateway:
      description: The provider failed or is unreachable.
      headers:
        x-request-id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
