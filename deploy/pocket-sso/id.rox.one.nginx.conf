# Public RoxID: same CT104 data store, new hostname. DNS/APP_URL cutover is separate.
server {
    listen 80;
    server_name id.rox.one;
    access_log /var/log/nginx/rox-id-access.log rox_sso_safe;
    location / { return 308 https://id.rox.one$request_uri; }
}

server {
    listen 127.0.0.1:8443 ssl http2;
    server_name id.rox.one;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/id.rox.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/id.rox.one/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    access_log /var/log/nginx/rox-id-access.log rox_sso_safe;
    error_log /var/log/nginx/rox-id-error.log;
    proxy_buffer_size 128k;
    proxy_buffers 8 128k;
    proxy_busy_buffers_size 256k;
    location / {
        proxy_pass http://192.168.1.104:1411;
        proxy_http_version 1.1;
        proxy_set_header Host id.rox.one;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host id.rox.one;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
