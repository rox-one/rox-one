[workspace]
resolver = "2"
members = [
  "crates/craft-protocol",
  "crates/craft-index",
  "crates/craft-rund",
  "crates/craft-journal",
  "crates/craft-exec",
  "crates/rox-chat-core",
  "apps/craft-native",
]

[workspace.package]
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
craft-protocol = { path = "crates/craft-protocol" }
craft-index = { path = "crates/craft-index" }
craft-rund = { path = "crates/craft-rund" }
craft-journal = { path = "crates/craft-journal" }
craft-exec = { path = "crates/craft-exec" }
rox-chat-core = { path = "crates/rox-chat-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "=1.43.1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "time"] }
tempfile = "=3.14.0"
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "handshake", "native-tls"] }
futures-util = "0.3"
# NB: `secp256k1` 0.29 has no `schnorr` feature — BIP340 support is
# unconditional in this version; `rand-std` provides the auxiliary-randomness
# plumbing used by the signing helpers.
secp256k1 = { version = "=0.29.1", features = ["rand", "rand-std"] }
napi = "=2.16.17"
napi-derive = "=2.16.13"
# native-tls → security-framework: 3.7+ needs edition2024 (rustc ≥1.85). Pin for MSRV 1.83.
security-framework = "=3.5.1"
