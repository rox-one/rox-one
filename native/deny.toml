# cargo-deny configuration for the Craft native (Rust) workspace.
# Mirrors the policy used by the relay upstream (see ../buzz-src/deny.toml):
# permissive licenses only, no GPL/AGPL.
#
# Run: cd native && cargo deny check licenses
#      cd native && cargo deny check

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "MITNFA",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    "BlueOak-1.0.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
