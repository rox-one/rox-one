  # https://github.com/restic/restic/releases (0.18.1 fixes 0.18.0 regressions)

windmill_version: "1.594.0"
  # https://www.windmill.dev/changelog

node_major: "22"
  # https://nodejs.org/en/about/previous-releases (22 = active LTS)

