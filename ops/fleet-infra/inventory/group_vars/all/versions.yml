docker_ce: "27.5.1"
  # https://docs.docker.com/engine/release-notes/27.x/

tailscale_version: "1.102.3"
  # https://pkgs.tailscale.com/stable/ubuntu noble; live candidate verified 2026-08-26

netdata_version: "v2.3.2"
  # https://github.com/netdata/netdata/releases (Agent stream)

coolify_version: "4.0.0-beta.400"
  # https://github.com/coollabsio/coolify/releases
