---
# Example ROX fleet inventory. Replace ansible_host with tailnet names in a
# private overlay (inventory/host_vars/, gitignored). Addresses use TEST-NET-1.
all:
  children:
    linux:
      children:
        managed_linux:
          vars:
            ansible_ssh_private_key_file: ~/.ssh/fleet_ansible_ed25519
            ansible_ssh_common_args: "-o BatchMode=yes -o StrictHostKeyChecking=yes"
          hosts:
            control-01:
              ansible_host: 192.0.2.10
              ansible_user: root
            automation-01:
              ansible_host: 192.0.2.11
              ansible_user: root
            observability-01:
              ansible_host: 192.0.2.12
              ansible_user: root
            worker-01:
              ansible_host: 192.0.2.13
              ansible_user: root
        recovery_linux:
          hosts:
            recovery-01:
              ansible_host: 192.0.2.20
              ansible_user: root
    apple:
      hosts:
        workstation-local:
          ansible_host: localhost
          ansible_connection: local
    control_plane:
      hosts:
        control-01:
    automation_control:
      hosts:
        automation-01:
    observability_control:
      hosts:
        observability-01:
    netbird_retire:
      hosts:
        worker-01:
    coolify_targets:
      hosts:
        worker-01:
        automation-01:
        observability-01:
