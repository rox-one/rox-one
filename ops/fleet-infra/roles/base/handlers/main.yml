---
- name: restart chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted
    enabled: true

- name: restart unattended-upgrades
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    state: restarted
    enabled: true

- name: sysctl reload
  ansible.builtin.command: sysctl --system
  changed_when: true
