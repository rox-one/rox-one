- id: RX-SEC-0008
  title: Bash-инструмент запускает login-shell, sanitized env может быть дополнен профилями
  kind: security
  path: packages/session-tools-core/src/handlers/host-bash.ts
  status: active
  refs: [RX-TSK-0307]
  note: |
    bash -lc (44-49) читает /etc/profile и ~/.bash_profile после createSanitizedEnv();
    профиль может переопределить PATH или вернуть секреты в env. Спавн аргументным массивом — инъекции нет.
    Требует проверки состава профилей. Severity: Низкая.

