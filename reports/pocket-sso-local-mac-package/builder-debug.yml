arm64:
  firstOrDefaultFilePatterns:
    - '!**/node_modules/**'
    - '!resources{,/**/*}'
    - '!release{,/**/*}'
    - resources/bin/darwin-arm64/**/*
    - dist/resources/bin/darwin-arm64/**/*
    - vendor/bun/**/*
    - '!release/*-unpacked{,/**/*}'
    - package.json
    - '!**/*.{iml,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,suo,xproj,cc,d.ts,mk,a,o,obj,forge-meta,pdb}'
    - '!**/._*'
    - '!**/electron-builder.{yaml,yml,json,json5,toml,ts}'
    - '!**/{.git,.hg,.svn,CVS,RCS,SCCS,__pycache__,.DS_Store,thumbs.db,.gitignore,.gitkeep,.gitattributes,.npmignore,.idea,.vs,.flowconfig,.jshintrc,.eslintrc,.circleci,.yarn-integrity,.yarn-metadata.json,yarn-error.log,yarn.lock,package-lock.json,npm-debug.log,pnpm-lock.yaml,bun.lock,bun.lockb,appveyor.yml,.travis.yml,circle.yml,.nyc_output,.husky,.github,electron-builder.env}'
    - '!.yarn{,/**/*}'
    - '!.editorconfig'
    - '!.yarnrc.yml'
  nodeModuleFilePatterns:
    - '**/*'
    - dist/**/*
    - '!dist/renderer/src/**'
    - '!**/*.map'
    - package.json
    - resources/pi-agent-server/**/*
    - '!resources/bridge-mcp-server/**/*'
    - '!resources/session-mcp-server/**/*'
    - '!dist/resources/bridge-mcp-server/**/*'
    - '!dist/resources/session-mcp-server/**/*'
    - resources/cloud-runner/**/*
    - packages/shared/src/unified-network-interceptor.ts
    - packages/shared/src/interceptor-common.ts
    - packages/shared/src/feature-flags.ts
    - packages/shared/src/interceptor-request-utils.ts
    - resources/scripts/**/*
    - resources/bin/markitdown
    - resources/bin/markitdown.cmd
    - resources/bin/pdf-tool
    - resources/bin/pdf-tool.cmd
    - resources/bin/xlsx-tool
    - resources/bin/xlsx-tool.cmd
    - resources/bin/doc-diff
    - resources/bin/doc-diff.cmd
    - resources/bin/img-tool
    - resources/bin/img-tool.cmd
    - resources/bin/docx-tool
    - resources/bin/docx-tool.cmd
    - resources/bin/pptx-tool
    - resources/bin/pptx-tool.cmd
    - resources/bin/ical-tool
    - resources/bin/ical-tool.cmd
    - '!**/resources/bin/{darwin,win32,linux}-*/**'
    - '!node_modules/**/*'
